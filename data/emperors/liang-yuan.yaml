summary: 武帝第七子，平侯景称帝于江陵；承圣二年讨平武陵王纪，承圣三年西魏破江陵，城破被俘杀，聚书十四万卷焚于兵火。
summary_en: Seventh son of Emperor Wu, he destroyed Hou Jing and took the throne at
  Jiangling; in the 2nd year of Chengsheng he put down the Prince of Wuling, and in
  the 3rd year Western Wei broke Jiangling — he was taken and slain, and his library
  of 140,000 volumes perished in the flames.
