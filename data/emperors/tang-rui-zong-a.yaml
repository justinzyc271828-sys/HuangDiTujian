summary: 高宗第八子，武后所生；中宗被废后继位，武后临朝称制；在位期间政事皆决于武后，载初元年武后称帝，改国号周，旦降为皇嗣。
summary_en: Eighth son of Gaozong by Empress Wu; he succeeded after Zhongzong's deposition,
  with Wu holding the court; in his reign every matter was decided by Wu, and in the
  1st year of Zaichu Wu took the throne, renaming the realm Zhou, and Dan was reduced
  to heir of the imperial line.
