summary: 杀兄和自立，在位八年；永嘉五年陷洛阳俘怀帝，建兴四年陷长安灭西晋，武功极盛；然游猎无度、后宫侈靡，史载记批评之甚。
summary_en: He slew his brother He to take the throne and reigned eight years; in
  the 5th year of Yongjia he took Luoyang and captured Emperor Huai, and in the 4th
  of Jianxing took Chang'an and ended Western Jin — his arms at their height; but
  his hunting and his harem drew the historians' sharpest censure.
