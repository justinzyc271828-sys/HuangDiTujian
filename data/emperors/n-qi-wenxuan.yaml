summary: 高欢第二子，受禅代东魏称帝，国号齐，都邺；初勤政、北讨山胡契丹、筑长城，后以酒狂杀戮，史极言之；天保十年崩。
summary_en: Second son of Gao Huan, he received the abdication of Eastern Wei and
  took the throne as Qi with its capital at Ye; diligent at first — campaigning north
  against the mountain Hu and the Khitan and building the Great Wall — he later drowned
  in wine and killed without measure, the histories condemning him utterly. He died
  in the 10th year of Tianbao.
