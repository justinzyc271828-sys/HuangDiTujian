summary: 明帝次子，即位后诛杀大臣、奢虐无度，潘妃金莲之奢传于后世；萧衍起兵襄阳，中兴元年建康陷落，帝被杀。
summary_en: Second son of Emperor Ming, on the throne he slew his ministers and gave
  himself to extravagance and cruelty — the golden-lotus stories of Consort Pan passing
  into legend; Xiao Yan rose from Xiangyang, Jiankang fell in the 1st year of Zhongxing,
  and the emperor was slain.
