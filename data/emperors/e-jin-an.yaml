summary: 不慧，寒暑不辨，在位二十二年而政归权臣：孙恩乱、桓玄篡、刘裕起兵反正，义熙年间裕灭南燕后秦；义熙十四年为刘裕使人缢杀。
summary_en: 'Dull of mind, unable to tell heat from cold, he reigned twenty-two years while strong ministers ruled: Sun En''s revolt, Huan Xuan''s usurpation, Liu Yu''s rising and restoration — in the Yixi years Yu destroyed Southern Yan and Later Qin, and in the 14th year of Yixi he had the emperor strangled.'
