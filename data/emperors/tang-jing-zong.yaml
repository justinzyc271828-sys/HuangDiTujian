summary: 穆宗长子；长庆四年即位，改元宝历；好击球手搏、游猎无度，不恤政事；宝历二年夜猎还宫，为宦官苏佐明等所弑，王守澄等立江王涵（文宗）。
summary_en: Eldest son of Muzong; he took the throne in the 4th year of Changqing,
  changing the era to Baoli; he loved polo and wrestling, hunting without limit, careless
  of government; in the 2nd year of Baoli, returning from a night hunt, he was slain
  by the eunuch Su Zuoming and the others, and Wang Shoucheng set up the Prince of
  Jiang, Han (Wenzong).
