summary: 懿宗第七子；僖宗崩后即位；有意兴复，屡与藩镇、宦官相争；天复元年宦官劫幸凤翔，依李茂贞；天复三年朱全忠迎帝还京、尽诛宦官；天祐元年全忠逼迁洛阳，旋弑帝。
summary_en: Seventh son of Yizong, he took the throne after Xizong's death; he meant
  to restore the realm and struggled again and again with the feudatories and the
  eunuchs; in the 1st year of Tianfu the eunuchs carried him to Fengxiang to lean
  on Li Maozhen; in the 3rd year Zhu Quanzhong brought him back and slaughtered the
  eunuchs; in the 1st year of Tianyou Quanzhong forced the move to Luoyang and soon
  slew him.
