summary: 邢州人，后唐西川节度使；同光三年唐灭前蜀，知祥为成都尹、西川节度；长兴中拒明宗，据蜀自固，并东川破董璋；明德元年称帝，国号蜀，数月崩。
summary_en: A man of Xingzhou, military governor of Xichuan under Later Tang; when
  Tang destroyed Former Shu in the 3rd year of Tongguang, Zhixiang became governor
  of Chengdu and Xichuan; in mid-Changxing he defied Mingzong, held Shu, and destroyed
  Dong Chuan's Dong Zhang; in the 1st year of Mingde he took the imperial title as
  the realm Shu, and died within months.
