summary: 高宗第七子，武后所生；弘道元年即位，改元嗣圣；欲以韦玄贞为侍中，为武后废为庐陵王，迁房州；圣历元年召还复为太子，为复位张本。
summary_en: Seventh son of Gaozong by Empress Wu; he took the throne in the 1st year
  of Hongdao, changing the era to Sisheng; seeking to make Wei Xuanzhen his chamberlain,
  he was deposed by Wu as Prince of Luling and moved to Fangzhou; in the 1st year
  of Shengli he was recalled and made heir again — the prelude to his restoration.
