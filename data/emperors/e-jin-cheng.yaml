summary: 五岁即位，庾后临朝、庾亮执政；咸和年间苏峻之乱，台城倾覆、帝蒙尘，赖陶侃等平乱复辟；后委政大臣，在位十七年。
summary_en: Ascending at five, he sat under Empress Yu's regency and Yu Liang's government; in the Xianhe years the Su Jun revolt saw the palace taken and the emperor carried off, until Tao Kan and the others put it down; thereafter he left rule to his ministers, reigning seventeen years.
