summary: 明帝长子，十岁即位，游戏虐杀无度，朝政归权臣萧道成；元徽五年为道成心腹弑于宫中，立安成王准。
summary_en: Eldest son of Emperor Ming, he took the throne at ten, playing and killing
  without limit while the strong minister Xiao Daocheng governed; in the 5th year
  of Yuanhui Daocheng's men slew him in the palace and set up the Prince of Ancheng,
  Zhun.
