summary: 武帝长子，十七岁即位，游戏无度、不亲政事；景平二年为徐羡之等废为营阳王，旋被弑，开南朝权臣废立之例。
summary_en: Eldest son of Emperor Wu, he took the throne at seventeen, playing endlessly
  and neglecting government; in the 2nd year of Jingping Xu Xianzhi and the others
  deposed him as Prince of Yingyang and soon slew him — the first deposition by ministers
  of the southern dynasties.
