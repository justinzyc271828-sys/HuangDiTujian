summary: 彭城王勰第三子，尔朱荣立之；即位即逢河阴之变，王公卿士二千余人沉河；永安三年于明光殿手刃尔朱荣，旋为尔朱兆所弑于晋阳。
summary_en: Third son of the Prince of Pengcheng, set up by Erzhu Rong; his accession
  opened with the Heyin massacre, over two thousand princes and ministers drowned
  in the river; in the 3rd year of Yong'an he slew Erzhu Rong with his own hand in
  the Mingguang Hall, and was soon done to death by Erzhu Zhao at Jinyang.
