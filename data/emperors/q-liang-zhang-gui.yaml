summary: 安定乌氏人，永宁元年出为凉州刺史，据河西；破鲜卑若罗拔能，威行河西；中原大乱中保境安民、贡献不绝，前凉基业始；建兴二年卒，谥武公。
summary_en: A man of Wushi in Anding, in the 1st year of Yongning he was made governor
  of Liangzhou and held Hexi; breaking the Xianbei Ruoluo Baneng, his name ran through
  Hexi; amid the collapse of the Central Plains he kept his borders and his people
  and never ceased tribute — the foundations of Former Liang. He died in the 2nd year
  of Jianxing, posthumously Duke Wu.
