summary: 由晋王平陈立功而立为太子，即位后营东都、开运河、西巡张掖、三征高句丽，把大工程与大征伐推向极致并致隋速亡的皇帝。
summary_en: The emperor who, made crown prince after earning merit in the conquest of Chen as Prince of Jin, went on to build the Eastern Capital, dig the canals, tour west to Zhangye, and campaign three times against Goguryeo, pushing grand projects and great campaigns to the extreme and bringing the Sui to a swift end.
