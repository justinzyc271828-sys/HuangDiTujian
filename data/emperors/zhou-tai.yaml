summary: 邢州尧山人；乾祐三年为邺都留守，因隐帝杀大臣起兵入汴；广顺元年称帝，国号周，都开封；废营田、减苛税，为世宗改革铺垫；显德元年崩，养子荣继。
summary_en: A man of Yaoshan, Xingzhou; in the 3rd year of Qianyou, as garrison commander
  of Yedu, he marched into Kaifeng over the Yin emperor's slaying of his ministers;
  in the 1st year of Guangshun he took the throne as the realm Zhou with its capital
  at Kaifeng; he abolished the military farms and lightened the harsh taxes, preparing
  Shizong's reforms; he died in the 1st year of Xiande, his adopted son Rong succeeding.
