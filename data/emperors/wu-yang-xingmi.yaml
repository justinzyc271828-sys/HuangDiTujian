summary: 庐州合肥人；唐末据淮南，为淮南节度使，都扬州；乾宁中破孙儒，定江淮；天复二年唐封吴王；保境息民，江淮小康；天祐二年卒。
summary_en: A man of Hefei in Luzhou; in the late Tang he held Huainan as military
  governor with his seat at Yangzhou; in mid-Qianning he destroyed Sun Ru and fixed
  the Jiang-Huai; in the 2nd year of Tianfu Tang made him King of Wu; he kept his
  borders and rested his people, and the Jiang-Huai knew modest peace. He died in
  the 2nd year of Tianyou.
