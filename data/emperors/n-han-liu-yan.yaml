summary: 上蔡人；乾化中继兄隐为清海节度使，据岭南；乾亨元年于番禺称帝，国号大越，旋改汉；有并岭南之功，然酷刑奢侈，史极言之；大有十五年卒。
summary_en: A man of Shangcai; in mid-Qianhua he succeeded his brother Yin as military
  governor of Qinghai, holding Lingnan; in the 1st year of Qianheng he took the throne
  at Panyu as the realm Great Yue, soon renamed Han; he united Lingnan by merit, but
  his cruel punishments and luxury the histories condemn utterly. He died in the 15th
  year of Dayou.
