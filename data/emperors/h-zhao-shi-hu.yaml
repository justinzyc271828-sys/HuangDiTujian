summary: 石勒侄，废杀石弘自立，迁都邺，后赵武功极盛；然暴虐著称，营宫室、兴大役、好杀伐，死后诸子争立，后赵迅即崩溃。
summary_en: Nephew of Shi Le, he deposed and slew Shi Hong to take the throne, moved
  the capital to Ye, and carried Later Zhao to its height of power; but his tyranny
  is proverbial — palaces, corvée, and slaughter — and after his death his sons fought,
  and Later Zhao collapsed at once.
