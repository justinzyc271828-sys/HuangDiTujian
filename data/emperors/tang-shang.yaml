summary: 中宗第四子；景龙四年中宗暴崩，韦后立之，改元唐隆；同年唐隆政变，李隆基与太平公主诛韦后，重茂让位睿宗；后徙房州，卒。
summary_en: Fourth son of Zhongzong; when Zhongzong died suddenly in the 4th year
  of Jinglong, Empress Wei set him up, changing the era to Tanglong; that same year,
  in the Tanglong coup, Li Longji and the Princess Taiping slew Empress Wei, Chongmao
  yielded the throne to Ruizong, and was later moved to Fangzhou, where he died.
