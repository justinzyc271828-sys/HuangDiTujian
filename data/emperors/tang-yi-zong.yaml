summary: 宣宗长子；大中十三年即位，改元咸通；咸通九年桂林戍卒庞勋起义，唐室大震；咸通十四年迎法门寺佛骨，耗费巨万；同年崩。
summary_en: Eldest son of Xuanzong; he took the throne in the 13th year of Dazhong,
  changing the era to Xiantong; in the 9th year of Xiantong the Guilin garrison rose
  under Pang Xun, shaking the Tang house; in the 14th year he welcomed the Famen Temple
  relic with vast expense, and died that same year.
