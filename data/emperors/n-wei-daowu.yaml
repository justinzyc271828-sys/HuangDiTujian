summary: 什翼犍之孙，代亡后复国，大会牛川即代王位，改称魏王；参合陂大破后燕、取并州、迁都平城称帝，离散部落、计口授田，北魏开国之基；晚年猜暴，天赐六年遇弑。
summary_en: Grandson of Shiyijian, he restored the state after Dai's fall, taking
  the throne at the Niuchuan assembly as King of Dai, then King of Wei; shattering
  Later Yan at the Canhe marshes, taking Bingzhou, and moving the capital to Pingcheng,
  he took the imperial throne, dissolved the tribes, and allotted land by mouth —
  the foundations of Northern Wei. In his last years jealous and cruel, he was slain
  in the 6th year of Tianci.
