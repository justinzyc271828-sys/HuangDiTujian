summary: 姚苌子，即位后破苻登、灭前秦残部，基本统一关陇；弘始三年迎鸠摩罗什入长安译经，大营塔寺，佛教极盛；又立律学、兴学校；晚年立嗣不明，永和元年崩。
summary_en: Son of Yao Chang, on his accession he broke Fu Deng, destroyed the remnants
  of Former Qin, and roughly united Guanzhong and Longxi; in the 3rd year of Hongshi
  he brought Kumarajiva to Chang'an to translate the scriptures, raised monasteries
  and pagodas, and Buddhism flourished; he also founded a law academy and schools.
  His succession was ill-managed, and he died in the 1st year of Yonghe.
