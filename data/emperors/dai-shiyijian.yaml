summary: 拓跋郁律子，质于后赵；即代王位，建元建国，都云中盛乐，始制法律、分土定居；屡北征高车、西击卫辰，代北强盛；建国三十九年为前秦所灭，北魏追尊昭成皇帝。
summary_en: Son of Tuoba Yulü, hostage in Later Zhao in his youth; taking the throne
  as King of Dai, he opened the era Jianguo with his capital at Shengle in Yunzhong,
  first made laws, and moved toward settled lands; campaigning north against the Gaoche
  and west against Weichen, the Dai realm grew strong in the north. In the 39th year
  of Jianguo Former Qin destroyed it; Northern Wei later honored him as Emperor Zhaocheng.
