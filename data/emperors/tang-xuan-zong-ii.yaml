summary: 宪宗第十三子；武宗崩后宦官立之，改元大中；大中元年罢李德裕，牛李党争格局变化；大中中张议潮归义，收复河湟部分；史称大中之治、小太宗；大中十三年崩。
summary_en: Thirteenth son of Xianzong, set up by the eunuchs after Wuzong's death,
  changing the era to Dazhong; in the 1st year he dismissed Li Deyu and the Niu–Li
  factional balance shifted; in mid-Dazhong Zhang Yichao's submission recovered part
  of the Hehuang; the histories call his reign the Dazhong recovery and him the "Little
  Taizong." He died in the 13th year of Dazhong.
