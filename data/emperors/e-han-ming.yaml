summary: 光武之子，严切持法，后宫不封侯与政；永平求法、云台图画，窦固取伊吾，班超使西域，明章之治前半。
summary_en: Son of Guangwu, strict in law and keeping the harem from power; the Yongping search for the Dharma, the Yuntai portraits, Dou Gu taking Yiwu, and Ban Chao sent west — the first half of the Ming-Zhang age.
