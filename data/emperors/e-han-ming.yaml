  summary: 诏报楚王英助「伊蒲塞桑门」盛馔，为官方文书中较早涉及浮屠者。
  summary_en: An edict acknowledged Prince Ying of Chu's patronage of "upasaka and shramana" feasts — an early mention of Buddhism in official documents.
