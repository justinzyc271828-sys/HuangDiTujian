  title: 西域诸国遣子入侍
  title_en: Western Regions Submit
  summary: 窦固、耿秉击车师，西域复通，诸国遣子入侍。
  summary_en: Dou Gu and Geng Bing struck Cheshi; the Western Regions were reopened and their states sent sons to serve at court.
