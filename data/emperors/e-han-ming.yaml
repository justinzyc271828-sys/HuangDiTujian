  title: 窦固取伊吾
  title_en: Dou Gu Takes Yiwu
  summary: 窦固等伐北匈奴，取伊吾卢地，置宜禾都尉；班超与郭恂俱使西域。
  summary_en: Dou Gu and others struck the northern Xiongnu, took the Yiwulu lands, and installed the Yihe commandant; Ban Chao and Guo Xun were sent to the Western Regions.
