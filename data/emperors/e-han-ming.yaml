  title: 图画云台功臣
  title_en: The Yuntai Portraits
  summary: 追感前世功臣，图画二十八将于南宫云台，以邓禹为首。
  summary_en: Recalling the founders' merits, he had the Twenty-eight Generals painted in the Yuntai Hall of the Southern Palace, headed by Deng Yu.
