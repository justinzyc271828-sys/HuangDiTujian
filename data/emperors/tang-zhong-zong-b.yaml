summary: 神龙元年张柬之等发动神龙政变，逼武后退位，中宗复位，复国号唐；还都长安后武三思等用事，韦后安乐公主卖官斜封；景龙四年暴崩，韦后临朝。
summary_en: In the 1st year of Shenlong, Zhang Jianzhi and the others staged the Shenlong
  coup, forced Empress Wu to abdicate, and restored Zhongzong; the realm's name reverted
  to Tang. After the return to Chang'an, Wu Sansi and the rest held power, and Empress
  Wei and the Princess Anle sold offices by "slanted letters"; in the 4th year of
  Jinglong he died suddenly, and Empress Wei took the regency.
