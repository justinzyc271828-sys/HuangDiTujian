summary: 文宣长子，十五岁即位；幼而好学，然不能自固，皇建元年为叔父常山王演所废为济南王，旋遇害。
summary_en: Eldest son of Wenxuan, he took the throne at fifteen; studious from youth
  but unable to hold his own, in the 1st year of Huangjian his uncle the Prince of
  Changshan, Yan, deposed him as Prince of Jinan, and he was soon done to death.
