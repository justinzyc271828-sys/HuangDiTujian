summary: 高欢第九子，孝昭崩后即位，改元太宁、河清，颁律令；然荒淫委任佞幸，河清四年禅位太子纬，自称太上皇，天统五年崩。
summary_en: Ninth son of Gao Huan, he took the throne after Xiaozhao's death, changing
  the eras to Taining and Heqing and issuing the statutes; but he gave himself to
  debauchery and trusted flatterers, and in the 4th year of Heqing abdicated to his
  heir Wei, styling himself Grand Emperor. He died in the 5th year of Tiantong.
