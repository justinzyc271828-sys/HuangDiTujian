summary: 宣帝太子，柔仁好儒而优游不断；石显弄权、昭君出塞，西汉由盛转衰之节点。
summary_en: Heir of Emperor Xuan, gentle and fond of Confucian learning yet irresolute; with Shi Xian wielding power and Wang Zhaojun sent to the Xiongnu, his reign marks the hinge of Western Han's decline.
