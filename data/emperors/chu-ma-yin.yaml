summary: 许州鄢陵人；乾宁中随孙儒余部入湖南，据潭州；开平元年梁封楚王，据湖南；兴茶商，听民自采茶卖，收税富国；长兴元年卒，诸子争立。
summary_en: A man of Yanling in Xuzhou; in mid-Qianning he entered Hunan with Sun
  Ru's remnant and held Tanzhou; in the 1st year of Kaiping Liang made him King of
  Chu, holding Hunan; he promoted the tea trade, letting the people gather and sell
  tea and taxing it to enrich the state. He died in the 1st year of Changxing, his
  sons contending.
