summary: 太武帝孙，宗爱弑太武后入定乱即位；兴安二年下诏复佛法，和平元年昙曜开云冈石窟，与民休息；和平六年崩。
summary_en: Grandson of Emperor Taiwu, he entered and steadied the realm after Zong
  Ai slew Taiwu; in the 2nd year of Xing'an he restored the Buddhist law by edict,
  and in the 1st year of Heping Tanyao opened the Yungang caves; he let the people
  rest. He died in the 6th year of Heping.
