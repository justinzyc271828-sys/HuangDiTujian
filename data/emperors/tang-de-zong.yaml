summary: 代宗长子；建中元年杨炎行两税法；建中四年泾原兵变、朱泚据长安称帝，帝幸奉天；兴元元年下罪己诏，李晟收复长安；晚年猜忌聚敛；贞元二十一年崩。
summary_en: Eldest son of Daizong; in the 1st year of Jianzhong Yang Yan introduced
  the two-tax system; in the 4th year the Jingyuan mutiny saw Zhu Ci take Chang'an
  as emperor and the sovereign flee to Fengtian; in the 1st year of Xingyuan the edict
  of self-blame was issued and Li Sheng recovered Chang'an; in his last years he grew
  suspicious and grasping. He died in the 21st year of Zhenyuan.
