summary: 靳准之乱后即帝位，迁都长安，改国号赵，立太学、造浑仪；太宁三年与石勒决战洛阳，兵败被俘，翌年遇害，前赵亡。
summary_en: After the Jin Zhun troubles he took the throne, moved the capital to Chang'an,
  and changed the realm's name to Zhao, founding an academy and casting an armillary
  sphere; in the 3rd year of Taining he met Shi Le at Luoyang, was taken prisoner,
  and died the next year — Former Zhao was at an end.
