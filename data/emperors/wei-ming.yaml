  title: 司马懿拒蜀
  title_en: Sima Yi Holds the Line
  summary: 诸葛亮四出祁山，司马懿坚壁不出，蜀粮尽退。
  summary_en: Zhuge Liang came a fourth time from Qishan; Sima Yi refused battle behind his walls until Shu ran out of grain and withdrew.
  place_id: null
  related_person_ids: []
  sources:
