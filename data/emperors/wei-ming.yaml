  title: 张掖柳谷口瑞石
  title_en: The Portent Stone at Liugu Pass
  summary: 张掖柳谷口出瑞石，群臣奏符瑞，帝受之。
  summary_en: A stone of good omen appeared at Liugu Pass in Zhangye; the courtiers offered it as a portent, and the emperor accepted it.
