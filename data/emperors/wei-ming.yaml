  date_note_en: 5th year of Qinglong, era changed in the 3rd month
  title: 改元景初
  title_en: Era Changed to Jingchu
  summary: 以青龙纪年不合历象，改元景初，建丑为正月。
  summary_en: Deeming the Qinglong count out of step with the calendar, he changed the era to Jingchu and made the 12th month the first of the year.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 三国志·卷003·明帝纪
  card_id: E008
- year: '237'
  date_note: 景初元年
  date_note_en: 1st year of Jingchu
  title: 大营宫室
  title_en: The Great Palace Works
  summary: 起洛阳宫、昭阳殿、太极殿，役民数万，谏者多被诛。
  summary_en: He raised the Luoyang Palace, the Zhaoyang and Taiji halls, driving tens of thousands to labor, and put many remonstrants to death.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 三国志·卷003·明帝纪
  card_id: E009
- year: '238'
  date_note: 景初二年
  date_note_en: 2nd year of Jingchu
  title: 司马懿平辽东
  title_en: Sima Yi Subdues Liaodong
  summary: 司马懿攻襄平，斩公孙渊，辽东悉平，魏地至朝鲜边境。
  summary_en: Sima Yi stormed Xiangping, beheaded Gongsun Yuan, and pacified all Liaodong, carrying Wei's bounds to the Korean frontier.
  place_id: liaodong
  related_person_ids: []
  sources:
  - 三国志·卷003·明帝纪
  card_id: E010
- year: '239'
  date_note: 景初三年正月
  date_note_en: 1st month, 3rd year of Jingchu
  title: 明帝崩托孤
  title_en: Death and the Regency Trust
  summary: 疾笃立养子齐王芳为嗣，托孤曹爽、司马懿，寻崩。
  summary_en: Mortally ill, he made his adopted son, Cao Fang of Qi, heir and entrusted him to Cao Shuang and Sima Yi, then died.
  place_id: luoyang
  related_person_ids:
  - wei-qi
  - wei-wen
  sources:
  - 三国志·卷003·明帝纪
  card_id: E011
- year: '239'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 毅然 果断
  title_en: Decisive, Self-Assured
  summary: 陈寿评明帝沈毅好断、任意不恤下人，能奋其威明而不尽礼于太后。
  summary_en: Chen Shou judged the emperor resolute and self-assured, heedless of others beneath him — able to display his stern brilliance yet wanting in duty to the empress dowager.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷003·明帝纪
