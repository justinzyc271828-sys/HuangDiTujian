  title: 诸葛亮卒于渭南
  title_en: Zhuge Liang Dies at the Weinan
  summary: 诸葛亮屯五丈原，与懿相持百馀日，病卒军中，蜀退。
  summary_en: Zhuge Liang camped on the Wuzhang Plain and faced Sima Yi for over a hundred days before dying of illness in camp; Shu withdrew.
  place_id: wuzhang-yuan
