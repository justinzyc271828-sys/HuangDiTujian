  title: 曹真伐蜀无功
  title_en: Cao Zhen's Fruitless Invasion of Shu
  summary: 曹真等大举伐蜀，会霖雨路断而还，无功。
  summary_en: Cao Zhen's great invasion of Shu met weeks of rain, the roads collapsed, and the army returned without result.
  place_id: null
