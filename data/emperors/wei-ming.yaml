  title_en: Jieting and Zhuge Liang's Expedition
  summary: 诸葛亮首出祁山，张郃破马谡于街亭，蜀军退还。
  summary_en: In Zhuge Liang's first expedition from Qishan, Zhang He broke Ma Su at Jieting, and the Shu army withdrew.
