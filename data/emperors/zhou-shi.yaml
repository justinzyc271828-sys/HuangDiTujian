  title: 高平之战
  title_en: Battle of Gaoping
  summary: 亲征败北汉、契丹联军于高平，战后整肃禁军，确立权威。
  summary_en: Campaigns in person and defeats the allied Northern Han and Khitan army at Gaoping, then purges the palace army and establishes his authority.
