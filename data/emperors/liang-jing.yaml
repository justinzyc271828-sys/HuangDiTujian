summary: 元帝第九子，江陵陷后即位于建康；陈霸先杀王僧辩、拒北齐，太平二年禅位于霸先，梁亡，禅后遇害。
summary_en: Ninth son of Emperor Yuan, he took the throne at Jiankang after the fall
  of Jiangling; Chen Baxian slew Wang Sengbian and held the Qi armies, and in the
  2nd year of Taiping the emperor abdicated to Baxian — Liang was no more, and he
  was slain after the abdication.
