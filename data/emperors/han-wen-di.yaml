summary: 以代王入继大统，除肉刑、免田租、罢露台，恭俭二十三年，开文景之治。
summary_en: Entering the throne as King of Dai, he abolished mutilation punishments, remitted the land tax, and forwent the Terrace; frugal through twenty-three years, he opened the Wen-Jing recovery.
