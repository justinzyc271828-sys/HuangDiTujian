timeline:
- year: '-196'
  date_note: 高祖十一年
  date_note_en: 11th year of Gaozu
  title: 立为代王
  title_en: Made King of Dai
  summary: 高祖诛陈豨、定代地，立刘恒为代王，都中都；在代凡十七年。
  summary_en: Gaozu executed Chen Xi, settled the Dai lands, and made Liu Heng king of Dai with his seat at Zhongdu; he remained there seventeen years.
  place_id: zhong-du
  related_person_ids:
  - han-gao-zu
  sources:
  - 汉书·卷004·文帝纪
  card_id: E001
- year: '-180'
  date_note: 高后八年后九月
  date_note_en: 8th year of Empress Lü, intercalary 9th month
  title: 大臣迎立入长安
  title_en: Called to the Throne at Chang'an
  summary: 诸吕既诛，陈平、周勃等迎代王；至渭桥奉玺，入未央宫即皇帝位。
  summary_en: With the Lü clan destroyed, Chen Ping, Zhou Bo, and others summoned the king of Dai; at the Wei Bridge he received the seal and entered the Weiyang Palace to take the throne.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  - 史记·孝文本纪
  card_id: E002
- year: '-179'
  date_note: 元年
  date_note_en: 1st year
  title: 益封诛吕功臣
  title_en: Rewards for the Lü-Court Destroyers
  summary: 益封周勃、陈平等诛诸吕有功者，以安中枢。
  summary_en: He enlarged the fiefs of Zhou Bo, Chen Ping, and others who had destroyed the Lü clan, to steady the court.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  card_id: E003
- year: '-178'
  date_note: 二年
  date_note_en: 2nd year
  title: 除诽谤妖言法
  title_en: Repeal of the Slander-and-Sedition Law
  summary: 除诽谤妖言之罪，令臣下得尽其言。
  summary_en: The crime of slander and seditious speech was abolished so ministers might speak fully.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  card_id: E004
- year: '-167'
  date_note: 十三年
  date_note_en: 13th year
  title: 除田租税
  title_en: Remission of the Land Tax
  summary: 诏农为天下之本，免天下田租以劝农。
  summary_en: He decreed agriculture the root of the realm and remitted the land tax to encourage farming.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  card_id: E005
- year: '-167'
  date_note: 十三年
  date_note_en: 13th year
  title: 除肉刑
  title_en: Abolition of Mutilation Punishments
  summary: 缇萦上书赎父，帝悲其意，遂除肉刑，更定法律。
  summary_en: Tiying petitioned to ransom her father; the emperor, moved, abolished mutilation punishments and revised the law.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  - 汉书·刑法志
  card_id: E006
- year: '-166'
  date_note: 十四年
  date_note_en: 14th year
  title: 匈奴入边
  title_en: Xiongnu Raids on the Frontier
  summary: 匈奴寇边杀北地都尉，汉屯兵备边；帝欲自征，为太后所止。
  summary_en: The Xiongnu raided the frontier, killing the commandant of Beidi; Han forces were posted along the border. The emperor wished to campaign in person but was stopped by the empress dowager.
  place_id: bei-di
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  card_id: E007
- year: '-165'
  date_note: 十五年
  date_note_en: 15th year
  title: 亲策贤良
  title_en: Examining the Worthy in Person
  summary: 诏举贤良能直言极谏者，上亲策之。
  summary_en: He ordered the recommendation of worthy men able to speak plainly and remonstrate boldly, and examined them in person.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  card_id: E008
- year: '-158'
  date_note: 后六年
  date_note_en: Later 6th year
  title: 匈奴大入与细柳
  title_en: The Great Raids and Xiliu Camp
  summary: 匈奴入上郡、云中；周亚夫军细柳，帝劳军不得驰入，称真将军。
  summary_en: The Xiongnu entered Shangjun and Yunzhong; Zhou Yafu's camp at Xiliu refused the emperor entry at speed, earning his praise as a true general.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷004·文帝纪
  - 史记·绛侯周勃世家
  card_id: E009
- year: '-157'
  date_note: 后七年六月
  date_note_en: Later 7th year, 6th month
  title: 文帝崩薄葬
  title_en: Death and the Frugal Will
  summary: 崩，遗诏天下短丧薄葬，霸陵因山为陵；景帝即位。
  summary_en: He died, his will ordering brief mourning and a frugal burial, the Baling mound hewn into the hillside; Emperor Jing succeeded.
  place_id: chang-an
  related_person_ids:
  - han-jing-di
  sources:
  - 汉书·卷004·文帝纪
  card_id: E010
