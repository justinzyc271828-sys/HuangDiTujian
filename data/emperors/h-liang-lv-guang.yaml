summary: 略阳氐，苻坚大将；建元十九年征西域，破龟兹，得鸠摩罗什；东还闻苻坚败，据姑臧自立，称凉州牧，后称三河王、天王；承康元年崩，诸子争立，后凉分裂。
summary_en: A Di of Lüeyang and a general of Fu Jian; in the 19th year of Jianyuan
  he campaigned in the Western Regions, broke Kucha, and brought back Kumarajiva;
  returning east on word of Fu Jian's fall, he held Guzang, styled himself Governor
  of Liangzhou, then King of the Three Rivers and Heavenly King. He died in the 1st
  year of Chengkang as his sons fought — Later Liang split apart.
