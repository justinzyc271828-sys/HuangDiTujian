summary: 高祖第二子；乾祐元年即位；乾祐二年河中李守贞反，三镇连叛，郭威平之；乾祐三年杀顾命大臣杨邠等，激变；同年郭威起兵入汴，隐帝被杀，后汉亡。
summary_en: Second son of Gaozu; he took the throne in the 1st year of Qianyou; in
  the 2nd year Li Shouzhen rose at Hezhong, three garrisons in league, and Guo Wei
  put it down; in the 3rd year he slew the regents Yang Bin and the others, provoking
  the storm; that same year Guo Wei marched into Kaifeng, the Yin emperor was slain,
  and Later Han was no more.
