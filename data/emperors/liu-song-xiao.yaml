summary: 起兵诛太子劭即位，平南郡王义宣、屠广陵灭竟陵王诞；然多兴土木、赋役烦苛，大明八年崩，前废帝继。
summary_en: Rising to slay the parricide heir Shao, he took the throne, put down the
  Prince of Nanjun's revolt, and massacred Guangling to end the Prince of Jingling's;
  but he raised buildings endlessly and burdened the people with levies. He died in
  the 8th year of Daming; the Former Deposed Emperor succeeded.
