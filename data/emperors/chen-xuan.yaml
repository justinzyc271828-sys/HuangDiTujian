summary: 文帝弟，废侄伯宗自立；太建五年吴明彻北伐，尽复淮南；北齐亡后争徐兖，吕梁之败，淮南复失，功败垂成；太建十四年崩。
summary_en: Younger brother of Emperor Wen, he deposed his nephew Bozong; in the 5th
  year of Taijian Wu Mingche's expedition recovered all the Huainan; after Northern
  Qi fell he contended for Xu and Yan, was shattered at Lüliang, and the Huainan was
  lost again — the enterprise failed at the last. He died in the 14th year of Taijian.
