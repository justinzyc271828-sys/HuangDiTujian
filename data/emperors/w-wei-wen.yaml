summary: 京兆王愉之子，孝文帝孙；孝武遇鸩后宇文泰立之，都长安，西魏始；大统三年沙苑之战破高欢，西魏立足，府兵制萌芽；大统十七年崩。
summary_en: Son of the Prince of Jingzhao, Yuan Yu, grandson of Emperor Xiaowen; after
  Xiaowu's poisoning Yuwen Tai set him up at Chang'an — the beginning of Western Wei.
  In the 3rd year of Datong the Shayuan battle broke Gao Huan and Western Wei stood;
  the fubing system began to take shape. He died in the 17th year of Datong.
