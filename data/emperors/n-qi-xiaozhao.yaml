summary: 高欢第六子，废侄高殷自立；留心政事、明察俭约，欲革文宣之弊；皇建二年亲征库莫奚，坠马伤重而崩，传位弟湛。
summary_en: Sixth son of Gao Huan, he deposed his nephew Yin to take the throne; attentive
  to government, clear-sighted and frugal, he meant to repair Wenxuan's evils; in
  the 2nd year of Huangjian, campaigning in person against the Kumo Xi, he fell from
  his horse, his hurt mortal, and died, passing the throne to his brother Zhan.
