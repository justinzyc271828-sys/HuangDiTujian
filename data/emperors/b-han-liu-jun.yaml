summary: 崇次子；乾祐七年即位，事辽益恭，岁贡契丹换取支援；宋太祖屡攻太原不克；天会十二年卒，国祚延至 979 灭。
summary_en: Second son of Chong; he took the throne in the 7th year of Qianyou, serving
  Liao ever more humbly, paying yearly tribute for support; Emperor Taizu of Song
  attacked Taiyuan again and again without taking it; he died in the 12th year of
  Tianhui, the realm lasting until its fall in 979.
