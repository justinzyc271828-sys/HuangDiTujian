summary: 清河王亶子，孝武西奔后高欢立之，迁都邺，东魏始；聪慧好文，然傀儡于高氏，武定八年禅位高洋，寻遇害。
summary_en: Son of the Prince of Qinghe, Yuan Dan; set up by Gao Huan after Xiaowu
  fled west, he moved the capital to Ye — the beginning of Eastern Wei. Sharp and
  fond of letters, he sat as the Gao house's puppet, abdicated to Gao Yang in the
  8th year of Wuding, and was soon done to death.
