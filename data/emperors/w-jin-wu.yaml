  title: 郊祀建制
  title_en: Rites and Institutions
  summary: 定郊庙之礼，建晋朝礼制框架。
  summary_en: He fixed the suburban and ancestral rites, framing the ceremonial order
    of Jin.
  place_id: luoyang
  related_person_ids: []
