summary: 受禅代魏建晋，太康元年平吴一统天下，罢州郡兵、大封宗室；晚年荒淫纵欲、宠信后党，为八王之乱埋祸。
summary_en: He received Wei's abdication to found Jin, unified the realm by conquering
  Wu in the 1st year of Taikang, disbanded the provincial armies, and enfeoffed the
  princes widely; in later years he gave himself to pleasure and trusted his wives'
  kin, laying the fuse of the War of the Eight Princes.
