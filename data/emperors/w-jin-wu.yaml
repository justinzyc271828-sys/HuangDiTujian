  date_note_en: 4th year of Taishi
  title: 班五条诏书
  title_en: The Five-Point Edict
  summary: 颁守令五条，整饬吏治。
  summary_en: He issued the five articles for local officials, tightening governance.
  place_id: luoyang
  related_person_ids: []
  sources:
