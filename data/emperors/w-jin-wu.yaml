  title: 受禅即位
  title_en: The Abdication Throne
  summary: 魏元帝禅位，炎即皇帝位，改元泰始，国号晋，都洛阳。
  summary_en: Emperor Yuan of Wei abdicated; Yan took the throne, changed the era
