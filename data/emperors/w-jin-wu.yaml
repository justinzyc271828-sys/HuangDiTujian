  card_id: E004
- year: '273'
  date_note: 泰始九年
  date_note_en: 9th year of Taishi
  title: 选公卿女充后宫
  title_en: Choosing the Court Ladies
  summary: 大采公卿之女充后宫，禁天下嫁娶，史称荒淫之渐。
  summary_en: He swept the daughters of the great houses into his harem and forbade
    all marriages in the realm — the beginnings, the histories say, of his debauchery.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E005
- year: '279'
  date_note: 咸宁五年
  date_note_en: 5th year of Xianning
  title: 马隆平凉州
  title_en: Ma Long Pacifies Liangzhou
  summary: 马隆率众击斩秃发树机能，凉州平。
  summary_en: Ma Long struck down Tufa Shujineng and pacified Liangzhou.
  place_id: hexi
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E006
- year: '280'
  date_note: 太康元年
  date_note_en: 1st year of Taikang
  title: 平吴统一
  title_en: Unification by the Wu Conquest
  summary: 命贾充为大都督，王濬、王浑等六路下吴，孙皓降，天下一统。
  summary_en: With Jia Chong grand commander, Wang Jun, Wang Hun, and others came
    down on Wu from six roads; Sun Hao surrendered and the realm was one.
  place_id: null
  related_person_ids:
  - wu-wucheng
  sources:
  - 晋书·卷003·武帝纪
  card_id: E008
- year: '280'
  date_note: 太康元年
  date_note_en: 1st year of Taikang
  title: 罢州郡兵
  title_en: Disbanding the Provincial Armies
  summary: 大郡置武吏百人，州郡武备削弱，史家谓八王之乱之背景。
  summary_en: The great commanderies kept but a hundred armed clerks; the provincial
    defenses were cut away — the historians see here the background of the War of
    the Eight Princes.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E007
- year: '282'
  date_note: 太康三年
  date_note_en: 3rd year of Taikang
  title: 诏州郡中正
  title_en: The Rectifiers of Provinces
  summary: 诏州郡各置中正，门阀选举体系延续。
  summary_en: He ordered rectifiers appointed in every province and commandery, carrying
    on the aristocratic system of selection.
  place_id: null
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E009
- year: '289'
  date_note: 太康十年
  date_note_en: 10th year of Taikang
  title: 封宗室强藩
  title_en: The Princes Given Power
  summary: 大封同姓诸王，出御四方，藩镇渐强。
  summary_en: He enfeoffed the imperial princes on a grand scale and sent them out
    to govern the four quarters, and the feudatories grew strong.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E010
- year: '290'
  date_note: 太熙元年四月
  date_note_en: 4th month, 1st year of Taixi
  title: 武帝崩
  title_en: Death of Emperor Wu
  summary: 崩，惠帝衷即位，杨骏辅政。
  summary_en: He died; Emperor Hui (Sima Zhong) succeeded with Yang Jun as regent.
  place_id: luoyang
  related_person_ids:
  - w-jin-hui
  sources:
  - 晋书·卷003·武帝纪
  card_id: E011
- year: '290'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 武皇总评
  title_en: Final Verdict
  summary: 晋书史臣评其宇量弘厚、明达善谋；平吴之后耽于游宴，宠爱后党，请谒公行，治道浸衰。
  summary_en: The Jin historians credit his broad bearing and shrewd counsel, yet
    after the Wu conquest he gave himself to feasting and hunting, favored his wives'
    kin, and let petitions flow by favor — the way of government decayed.
  place_id: null
  related_person_ids: []
  sources:
  - 晋书·卷003·武帝纪
  card_id: E012
