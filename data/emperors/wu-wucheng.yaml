  title_en: Puru Yangxing and Zhang Bu Slain
  summary: 迎立功臣濮阳兴、张布以谏被诛，凶虐之端自此。
  summary_en: The ministers who brought him in, Puru Yangxing and Zhang Bu, were slain for remonstrance — the first marks of his tyranny.
