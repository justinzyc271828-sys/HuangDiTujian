  summary: 史评称皓凶顽骄暴，虐杀朝臣，亲昵小人，吴之亡实由其自取。
  summary_en: The histories call Hao brutal and arrogant, slaying his courtiers, clinging to petty men — Wu's ruin self-inflicted.
