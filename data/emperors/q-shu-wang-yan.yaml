summary: 建幼子；光天元年即位；游宴无度，与韩昭等为小词，不理政事；咸康元年唐军入蜀，衍降，前蜀亡；同光中押送途中被杀。
summary_en: Youngest son of Jian; he took the throne in the 1st year of Guangtian;
  feasting without limit, writing little verses with Han Zhao and the rest, careless
  of government; in the 1st year of Xiankang the Tang army entered Shu, Yan surrendered,
  and Former Shu was no more; in mid-Tongguang he was slain on the way to custody.
