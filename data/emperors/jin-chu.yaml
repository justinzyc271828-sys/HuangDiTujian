summary: 敬瑭兄子，立为嗣；天福七年即位，改元开运；景延广等主战拒称臣，契丹南伐，晋军一度拒之；开运四年契丹入汴，出帝被俘北迁，后晋亡。
summary_en: Son of Jingtang's elder brother, made his heir; he took the throne in
  the 7th year of Tianfu, changing the era to Kaiyun; Jing Yangguang and the others
  urged war and refused vassalage, the Khitan marched south, and the Jin armies held
  them for a time; in the 4th year of Kaiyun the Khitan entered Kaifeng, the Emperor
  Chu was taken north, and Later Jin was no more.
