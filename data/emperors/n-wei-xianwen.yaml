summary: 文成帝长子，年幼即位，冯太后临朝；诛乙浑后亲政，好黄老浮屠，志在恬退；皇兴五年禅位太子宏，自称太上皇，承明元年暴崩。
summary_en: Eldest son of Wencheng, he took the throne young under Empress Feng's
  regency; after slaying Yi Hun he ruled in person, loving Huang–Lao and the Buddha,
  his mind set on withdrawal; in the 5th year of Huangxing he abdicated to his heir
  Hong and called himself Grand Emperor, dying suddenly in the 1st year of Chengming.
