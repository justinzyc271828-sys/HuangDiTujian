summary: 苻洪之子，统众入关据长安，自称天王、大单于，国号大秦，旋称帝；皇始中坚壁清野拒桓温北伐，前秦基业始固；皇始五年崩，子生继而残虐。
summary_en: Son of Fu Hong, he led the host into the pass, took Chang'an, styled himself
  Heavenly King and Great Chanyu of the realm Great Qin, then emperor; in mid-Huangshi
  he denied Huan Wen's expedition by clearing the land, and the Qin foundations were
  set. He died in the 5th year of Huangshi, his cruel son Sheng succeeding.
