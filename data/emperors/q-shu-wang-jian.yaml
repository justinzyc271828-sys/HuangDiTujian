summary: 许州舞阳人；大顺中攻陈敬瑄，据两川；天复中唐封蜀王；梁篡唐，建称帝，国号蜀，都成都；光天元年崩，子衍继。
summary_en: A man of Wuyang in Xuzhou; in mid-Dashun he attacked Chen Jingxuan and
  held the two Chuan; in mid-Tianfu Tang made him King of Shu; when Liang usurped
  Tang, Jian took the imperial title as the realm Shu with its capital at Chengdu.
  He died in the 1st year of Guangtian; his son Yan succeeded.
