summary: 太祖第三子；凤历元年诛兄友珪即位；在位与李存勖争河北，梁势渐蹙；龙德三年唐军入汴，末帝命皇甫麟杀己，后梁亡。
summary_en: Third son of Taizu; in the 1st year of Fengli he slew his brother Yougui
  and took the throne; through his reign he contended with Li Cunxu for Hebei as Liang's
  strength ebbed; in the 3rd year of Longde the Tang army entered Kaifeng, and the
  Last Sovereign had Huangfu Lin kill him — Later Liang was no more.
