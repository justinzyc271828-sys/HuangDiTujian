summary: 懿宗第五子；十二岁即位，改元乾符；乾符二年王仙芝、黄巢起兵；广明元年黄巢入长安称齐，帝幸蜀；中和三年李克用等破巢，收复长安；文德元年还京后崩。
summary_en: Fifth son of Yizong; he took the throne at twelve, changing the era to
  Qianfu; in the 2nd year Wang Xianzhi and Huang Chao rose; in the 1st year of Guangming
  Huang Chao entered Chang'an as emperor of Qi and the sovereign fled to Shu; in the
  3rd year of Zhonghe Li Keyong and the others destroyed Chao and recovered Chang'an;
  returning to the capital, he died in the 1st year of Wende.
