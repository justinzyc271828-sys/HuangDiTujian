summary: 少孤贩履，以兴复汉室为志，得诸葛亮而后成三分之业；章武元年称帝，为报关羽之仇伐吴，夷陵大败，崩于永安。
summary_en: Orphaned young, he hawked straw shoes; with the restoration of Han as his aim, he won the tripartite realm after gaining Zhuge Liang; crowned in the 1st year of Zhangwu, he attacked Wu to avenge Guan Yu, was shattered at Yiling, and died at Yong'an.
