  title: 生涿郡
  title_en: Birth at Zhuojun
  summary: 汉景帝子中山靖王胜之后，家贫，与母贩履织席为业。
  summary_en: A descendant of Liu Sheng, Prince Jing of Zhongshan, son of Emperor Jing of Han, he grew up poor, selling straw shoes and mats with his mother.
