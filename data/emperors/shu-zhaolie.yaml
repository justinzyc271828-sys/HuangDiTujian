- year: '184'
  date_note: 中平元年
  date_note_en: 1st year of Zhongping
  title: 与黄巾战
  title_en: Against the Yellow Turbans
  summary: 黄巾起，备率徒众从军征讨，以功除安喜尉。
  summary_en: When the Yellow Turbans rose, Bei led his followers into the army, earning by merit the post of commandant of Anxi.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E002
- year: '200'
  date_note: 建安五年
  date_note_en: 5th year of Jian'an
  title: 归曹操又叛
  title_en: Serving Cao Cao, Then Turning
  summary: 失徐州依曹操，操厚待之；寻与董承谋泄，走归袁绍。
  summary_en: Losing Xuzhou he took refuge with Cao Cao, who treated him generously; but the plot with Dong Cheng leaked, and he fled to Yuan Shao.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E003
- year: '208'
  date_note: 建安十三年
  date_note_en: 13th year of Jian'an
  title: 赤壁联合抗曹
  title_en: The Red Cliffs Alliance
  summary: 曹操南下，诸葛亮说孙权，孙刘联军大破曹军于赤壁。
  summary_en: Cao Cao came south; Zhuge Liang persuaded Sun Quan, and the Sun–Liu allies shattered the Cao army at the Red Cliffs.
  place_id: chi-bi
  related_person_ids:
  - wu-da
  sources:
  - 三国志·卷032·先主传
  - 三国志·吴书·吴主传
  card_id: E004
- year: '214'
  date_note: 建安十九年
  date_note_en: 19th year of Jian'an
  title: 得益州
  title_en: Winning Yizhou
  summary: 刘璋迎备入蜀，备反攻取成都，得益州，自领益州牧。
  summary_en: Liu Zhang invited Bei into Shu; Bei turned on him, took Chengdu, won Yizhou, and styled himself its governor.
  place_id: cheng-du
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E005
- year: '219'
  date_note: 建安二十四年
  date_note_en: 24th year of Jian'an
  title: 汉中称王
  title_en: King of Hanzhong
  summary: 与曹操争汉中，大胜，遂于沔阳进位汉中王。
  summary_en: Vying with Cao Cao for Hanzhong, he won decisively and took the title King of Hanzhong at Mianyang.
  place_id: han-zhong
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E006
- year: '219'
  date_note: 建安二十四年
  date_note_en: 24th year of Jian'an
  title: 关羽失荆州
  title_en: Guan Yu Loses Jingzhou
  summary: 关羽北伐襄樊，吕蒙袭取江陵，羽败被杀，荆州归吴。
  summary_en: While Guan Yu campaigned north to Xiangfan, Lü Meng seized Jiangling behind him; Yu fell and was slain, and Jingzhou passed to Wu.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  - 三国志·吴书·吕蒙传
  card_id: E007
- year: '221'
  date_note: 章武元年四月
  date_note_en: 4th month, 1st year of Zhangwu
  title: 即皇帝位
  title_en: Taking the Imperial Throne
  summary: 闻汉献帝被害（讹传），于成都即皇帝位，国号汉，以续汉统。
  summary_en: On the rumored death of Emperor Xian, he took the throne at Chengdu, styling his realm Han in continuation of the Han line.
  place_id: cheng-du
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E008
- year: '221'
  date_note: 章武元年七月
  date_note_en: 7th month, 1st year of Zhangwu
  title: 伐吴
  title_en: Campaign against Wu
  summary: 为关羽复仇，亲率大军伐吴；赵云、诸葛亮等谏不听。
  summary_en: To avenge Guan Yu he led the host against Wu in person, deaf to the remonstrances of Zhao Yun and Zhuge Liang.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E009
- year: '222'
  date_note: 章武二年
  date_note_en: 2nd year of Zhangwu
  title: 夷陵之败
  title_en: The Disaster at Yiling
  summary: 陆逊火烧连营，备大败，退保白帝城，仅以身免。
  summary_en: Lu Xun burned the linked camps; Bei was routed, fled to White Emperor City, and escaped with his life alone.
  place_id: yi-ling
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  - 三国志·吴书·陆逊传
  card_id: E010
- year: '223'
  date_note: 章武三年四月
  date_note_en: 4th month, 3rd year of Zhangwu
  title: 崩于永安
  title_en: Death at Yong'an
  summary: 病笃，托孤于诸葛亮，崩于永安宫，年六十三，后主禅即位。
  summary_en: Mortally ill, he entrusted his heir to Zhuge Liang and died in the Yong'an Palace, aged sixty-three; Liu Shan, the Later Sovereign, succeeded.
  place_id: yong-an
  related_person_ids:
  - shu-houzhu
  sources:
  - 三国志·卷032·先主传
  - 三国志·蜀书·诸葛亮传
  card_id: E011
- year: '223'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 先主总评
  title_en: Final Verdict
  summary: 陈寿评其弘毅宽厚、知人待士，有高祖之风、英雄之器，惜机权干略不逮。
  summary_en: Chen Shou praised his magnanimity, his discernment of men, and his treatment of officers — the manner of Gaozu and the bearing of a hero — while regretting that his cunning and resource fell short.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷032·先主传
  card_id: E012
