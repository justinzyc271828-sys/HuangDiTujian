summary: 杭州临安人；开平元年梁封吴越王，据两浙；筑捍海塘，治钱塘江堤，保杭嘉；对中原称臣纳贡，保境安民；长兴三年卒。
summary_en: A man of Lin'an in Hangzhou; in the 1st year of Kaiping Liang made him
  King of Wuyue, holding the two Zhe; he built the sea wall, diking the Qiantang to
  protect Hang and Jia; a vassal paying tribute to the Central Plains, he kept his
  borders and his people. He died in the 3rd year of Changxing.
