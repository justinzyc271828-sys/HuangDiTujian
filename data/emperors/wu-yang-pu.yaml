summary: 行密第四子；兄隆演卒后即位，徐温、徐知诰父子相继辅政；乾贞元年称帝；天祚三年禅位于徐知诰（李昪），吴亡。
summary_en: Fourth son of Xingmi; he took the throne after his brother Longyan's death,
  with Xu Wen and then Xu Zhigao governing; in the 1st year of Qianzhen he took the
  imperial title; in the 3rd year of Tianzuo he abdicated to Xu Zhigao (Li Bian) —
  Wu was no more.
