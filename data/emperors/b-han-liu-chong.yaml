summary: 知远弟，河东节度使；乾祐四年郭威建周，崇于太原称帝，国号汉，依契丹，称侄皇帝；乾祐七年联契丹攻周，败于高平，寻卒。
summary_en: Younger brother of Zhiyuan, governor of Hedong; in the 4th year of Qianyou,
  when Guo Wei founded Zhou, Chong took the throne at Taiyuan as the realm Han, leaning
  on the Khitan and calling himself their nephew emperor; in the 7th year of Qianyou
  he attacked Zhou with the Khitan, was shattered at Gaoping, and died soon after.
