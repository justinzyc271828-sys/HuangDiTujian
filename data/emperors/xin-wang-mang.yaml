  date_note: 始建国年间
  date_note_en: Shijianguo period
  title: 托古改制
  title_en: Archaizing Reforms
  summary: 行王田、禁奴婢，屡改货币官名，托《周礼》等经典，社会震荡剧烈。
  summary_en: He imposed "king's fields" and banned the trade in slaves, repeatedly changed coinage and office names on the authority of the Rites of Zhou and other classics, and shook society severely.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷099·王莽传
  card_id: E005
