summary: 以外戚身份与儒学声望居摄代汉，建国号新并力行托古改制，终在边患与民变中迅速崩亡的争议之主。
summary_en: A consort-clan kinsman whose Confucian renown carried him from regency to the throne, he founded the Xin dynasty and pressed archaizing reforms, a controversial ruler whose regime swiftly collapsed amid frontier wars and popular revolt.
