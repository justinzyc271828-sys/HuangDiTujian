summary: 汉人冯氏，杀后燕慕容熙，推高云，云被杀后即天王位，都龙城；省徭薄赋、安集流民，与柔然和亲，保境二十余年；太平二十二年崩，弟弘杀太子自立，后亡于魏。
summary_en: A Han of the Feng house, he slew the Later Yan emperor Murong Xi, set
  up Gao Yun, and when Yun was slain took the heavenly throne himself at Longcheng;
  lightening corvée and taxes and gathering the refugees, he married peace with the
  Rouran and held his borders over twenty years. He died in the 22nd year of Taiping;
  his brother Hong slew the heir to take the throne, and Wei later destroyed the realm.
