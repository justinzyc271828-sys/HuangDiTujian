summary: 穆宗第五子；文宗崩后宦官立之，改元会昌；任李德裕为相，会昌三年讨平泽潞，有会昌中兴之称；会昌五年废佛寺、僧尼还俗，史称会昌法难；好道服丹，会昌六年崩。
summary_en: Fifth son of Muzong, set up by the eunuchs after Wenzong's death, changing
  the era to Huichang; with Li Deyu as chancellor he destroyed Zelu in the 3rd year
  — the "Huichang revival"; in the 5th year he abolished the monasteries and sent
  the monks and nuns back to lay life — the Huichang persecution; fond of Daoism and
  elixirs, he died in the 6th year of Huichang.
