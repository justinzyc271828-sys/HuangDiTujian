summary: 广陵王羽之子，尔朱世隆等立为帝；在位约一年，傀儡于尔朱氏，普泰二年高欢入洛被废，寻遇害。
summary_en: Son of the Prince of Guangling, Yuan Yu, set up by Erzhu Shilong and the
  others; about a year he reigned as the Erzhu's puppet, until Gao Huan entered Luoyang
