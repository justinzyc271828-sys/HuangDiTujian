summary: 本姓王，明宗养子；清泰元年废闵帝自立；清泰二年猜忌石敬瑭，移镇削兵；清泰三年石敬瑭联契丹反，割燕云十六州；同年契丹晋军入洛，末帝自焚，后唐亡。
summary_en: Originally of the Wang surname, adopted son of Mingzong; in the 1st year
  of Qingtai he deposed the Min emperor and took the throne; in the 2nd year he came
  to distrust Shi Jingtang, moving and stripping his garrisons; in the 3rd year Jingtang
  rose with the Khitan, ceding the Sixteen Prefectures of Yanyun; that same year the
  Khitan and Jin armies entered Luoyang and the Last Sovereign burned himself — Later
  Tang was no more.
