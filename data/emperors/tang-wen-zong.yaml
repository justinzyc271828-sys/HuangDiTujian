summary: 穆宗第二子；敬宗被弑后宦官立之；恭俭好文，有意除宦，大和九年甘露之变事败，宦官大杀朝士，帝受制；开成五年崩。
summary_en: Second son of Muzong, set up by the eunuchs after Jingzong's slaying;
  frugal and fond of letters, he meant to destroy the eunuchs; in the 9th year of
  Dahe the Ganlu incident failed, the eunuchs slaughtered the courtiers, and the emperor
  was bound. He died in the 5th year of Kaicheng.
