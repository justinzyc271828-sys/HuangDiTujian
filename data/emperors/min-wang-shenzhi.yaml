summary: 光州固始人；随王绪入闽，乾宁中继兄潮为威武军节度使，据福州；开平三年梁封闽王，都福州；轻徭薄赋、招徕海商，闽人称贤；同光三年卒。
summary_en: A man of Gushi in Guangzhou; he entered Min with Wang Xu and, in mid-Qianning,
  succeeded his brother Chao as military governor of the Weiwu army, holding Fuzhou;
  in the 3rd year of Kaiping Liang made him King of Min with his seat at Fuzhou; he
  lightened the levies, drew in the sea merchants, and the people of Min called him
  worthy. He died in the 3rd year of Tongguang.
