summary: 武帝长子，即位后自比上帝，立四皇后，刑杀无度，史称天元侈暴；大象元年禅位太子阐，自称天元皇帝，大象二年崩，杨坚辅政。
summary_en: Eldest son of Emperor Wu, on the throne he compared himself to God, set
  up four empresses at once, and punished and slew without measure — the histories
  call him the extravagant Heavenly Sovereign; in the 1st year of Daxiang he abdicated
  to his heir Chan, styling himself the Heavenly Emperor Tianyuan, and died in the
  2nd year, leaving Yang Jian regent.
