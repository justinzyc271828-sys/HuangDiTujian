summary: 明帝第三子，十岁即位，实权在萧道成；沈攸之起兵被平，升明三年禅位于萧道成，宋亡，禅后遇害。
summary_en: Third son of Emperor Ming, he took the throne at ten with Xiao Daocheng
  holding the real power; Shen Youzhi's rising was put down, and in the 3rd year of
  Shengming he abdicated to Xiao Daocheng — Song was no more, and he was done to death
  after the abdication.
