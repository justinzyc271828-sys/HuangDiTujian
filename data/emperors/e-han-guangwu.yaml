summary: 新末起兵、昆阳破新，重建汉室而定都洛阳，以柔道治国、封禅告成的中兴开国皇帝。
summary_en: Restorer of the Han who rose amid the Xin-dynasty collapse, shattered the Xin army at Kunyang, refounded the dynasty with its capital at Luoyang, governed by the "way of softness," and crowned the restoration with the Feng and Shan sacrifices.
