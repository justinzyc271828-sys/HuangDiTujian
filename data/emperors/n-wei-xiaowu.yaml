summary: 广平武穆王怀第三子，高欢立之；不甘受制，永熙三年西奔长安依宇文泰，旋遇鸩——北魏由此分为东西。
summary_en: Third son of the Prince of Guangping, Yuan Huai, set up by Gao Huan; unable
  to bear the restraint, in the 3rd year of Yongxi he fled west to Chang'an and Xiao
  Wentai, and was soon poisoned — Northern Wei split into east and west.
