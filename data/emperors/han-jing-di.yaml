  title: 周亚夫下狱死
  title_en: Zhou Yafu Dies in Prison
  summary: 丞相周亚夫以子买官器事牵连下狱，不食五日呕血死。
  summary_en: Chancellor Zhou Yafu was imprisoned on charges involving his son's purchase of burial goods and died of starvation, vomiting blood on the fifth day.
