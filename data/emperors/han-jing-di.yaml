  title_en: Death of the Prince of Linjiang
  summary: 临江王荣坐侵庙壖地为宫，征诣中尉，自杀。
  summary_en: Rong, prince of Linjiang, was summoned to the Commandant of Justice for taking temple land for a palace, and killed himself.
