  title_en: Prince Xiao of Liang Bars the Rebels
  summary: 梁孝王城守，吴楚兵不得过梁，亚夫得以破敌。
  summary_en: Prince Xiao of Liang held his walls, and the rebels could not pass; Yafu could then break them.
