  title_en: Chao Cuo Beheaded at the East Market
  summary: 袁盎说上，斩错以谢吴楚；错死而吴楚兵不止。
  summary_en: At Yuan Ang's persuasion the emperor executed Chao Cuo to appease Wu and Chu; the armies pressed on regardless.
