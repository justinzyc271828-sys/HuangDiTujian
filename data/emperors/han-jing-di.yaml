  title: 周亚夫平吴楚
  title_en: Zhou Yafu Quells Wu and Chu
  summary: 太尉周亚夫坚壁昌邑，断吴粮道，三月破吴楚，余国皆平。
  summary_en: Grand Commandant Zhou Yafu held fast at Changyi, cut Wu's grain route, and broke Wu and Chu within three months; the other states were settled.
  place_id: chang-yi
  related_person_ids: []
