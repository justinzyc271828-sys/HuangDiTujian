  title_en: Revolt of the Seven States
  summary: 吴王濞、楚王戊等七国以诛晁错为名举兵西向。
  summary_en: Wu's king Bi, Chu's king Wu, and five others rose and marched west under the pretext of executing Chao Cuo.
