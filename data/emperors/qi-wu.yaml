summary: 高帝长子，永明十一年治世，劝农减役、百姓丰乐，史称「永明之治」；与竟陵王西邸文士相善，文学史称永明体；北讨无大功，永明十一年崩。
summary_en: Eldest son of Emperor Gao, his eleven years of the Yongming era — farming
  encouraged, corvée lightened, the people prosperous — are the celebrated "Yongming
  recovery"; his friendship with the writers of the Prince of Jingling's western mansion
  gave the literary age its "Yongming style." The northern campaigns gained nothing,
  and he died in the 11th year of Yongming.
