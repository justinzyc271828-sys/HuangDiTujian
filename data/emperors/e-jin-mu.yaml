summary: 两岁即位，褚太后临朝；永和年间桓温灭成汉、北伐关中复洛阳，殷浩、谢万北伐皆败；升平五年崩，年十九。
summary_en: Ascending at two under Empress Chu's regency, his Yonghe years saw Huan Wen destroy Cheng Han, march into Guanzhong, and restore Luoyang, while Yin Hao's and Xie Wan's expeditions failed; he died in the 5th year of Shengping at nineteen.
