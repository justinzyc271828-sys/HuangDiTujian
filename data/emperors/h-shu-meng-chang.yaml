summary: 知祥第三子；明德元年即位；蜀中相对安定，好文学，升平文治；乾德三年王全斌伐蜀，昶降，后蜀亡；至京师封秦国公，卒。
summary_en: Third son of Zhixiang; he took the throne in the 1st year of Mingde; Shu
  was comparatively at peace, and he loved letters — an age of culture; in the 3rd
  year of Qiande Wang Quanbin invaded, Chang surrendered, and Later Shu was no more;
  brought to the capital, he was made Duke of Qin and died.
