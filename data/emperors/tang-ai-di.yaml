summary: 昭宗第九子；天祐元年昭宗被弑，朱全忠立之，年十三；天祐二年白马驿之祸，全忠杀朝士三十余人投河；天祐四年禅位于朱全忠，唐亡，梁建；降封后遇害。
summary_en: Ninth son of Zhaozong; after Zhaozong's slaying in the 1st year of Tianyou,
  Zhu Quanzhong set him up at thirteen; in the 2nd year came the Baimayi disaster,
  Quanzhong drowning over thirty courtiers in the river; in the 4th year he abdicated
  to Quanzhong — Tang perished and Liang arose — and, reduced in rank, was done to
  death.
