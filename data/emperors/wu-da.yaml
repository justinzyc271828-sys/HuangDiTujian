  title: 废太子和
  title_en: The Deposition of He
  summary: 二宫之争，权废太子和，赐鲁王霸死，陆逊忧愤卒。
  summary_en: In the two-palace feud Quan deposed the crown prince He, ordered Prince Ba of Lu to die, and Lu Xun died of grief and rage.
