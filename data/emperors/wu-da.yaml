- year: '252'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 吴主总评
  title_en: Final Verdict
  summary: 陈寿评其任才尚计、有勾践之奇英，而性多嫌忌、果于杀戮，立嗣再误，吴之亡萌于斯。
  summary_en: Chen Shou praised his use of talent and his stratagems — the rare heroism of a Goujian — while noting his jealousy and readiness to kill; the succession erred twice, and Wu's ruin sprouted here.
