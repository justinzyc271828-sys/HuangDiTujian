  title: 权崩
  title_en: Death of Sun Quan
  summary: 立少子孙亮为太子，寻崩，年七十一；亮即位，诸葛恪辅政。
  summary_en: He named his youngest son, Sun Liang, heir and died, aged seventy-one; Liang took the throne with Zhuge Ke as regent.
