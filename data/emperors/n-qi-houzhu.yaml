summary: 武成长子，十岁即位；好弹琵琶作无愁曲，史称「无愁天子」；武平三年听谗杀名将斛律光，周武帝乘隙灭齐，被俘，北齐亡。
summary_en: Eldest son of Wucheng, he took the throne at ten; fond of the pipa and
  its "song without sorrow," the histories call him the "Sorrowless Sovereign"; in
  the 3rd year of Wuping, on slander, he slew the great general Hulü Guang, and Emperor
  Wu of Zhou struck through the gap and destroyed Qi — he was taken, and Northern
  Qi was no more.
