  title_en: Zhao Gao Sets Up Ziying
  summary: 赵高弑二世，立子婴，去帝号称王，秦政尽在赵高。
  summary_en: Zhao Gao murdered the Second Emperor, set up Ziying, and dropped the imperial title for that of king; all Qin governance lay in Zhao Gao's hands.
