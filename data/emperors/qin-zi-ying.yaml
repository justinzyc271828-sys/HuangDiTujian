  title: 诛杀赵高
  title_en: Putting Zhao Gao to Death
  summary: 子婴与其二子及宦者韩谈谋，刺杀赵高于斋宫，夷三族。
  summary_en: Ziying conspired with his two sons and the eunuch Han Tan, struck down Zhao Gao in the fasting palace, and exterminated his kin.
  place_id: xianyang
  related_person_ids: []
  sources:
  - 史记·卷006·秦始皇本纪
