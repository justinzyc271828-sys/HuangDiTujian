  date_note: 汉元年
  date_note_en: 1st year of Han
  title: 项羽杀子婴
  title_en: Xiang Yu Puts Ziying to Death
  summary: 项羽入关屠咸阳，杀子婴，烧秦宫室，秦社稷绝。
  summary_en: Xiang Yu entered the pass, sacked Xianyang, killed Ziying, and burned the Qin palaces; the Qin altars were cut off forever.
  place_id: xianyang
  related_person_ids: []
  sources:
  - 史记·卷007·项羽本纪
  card_id: E004
- year: '-206'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 子婴总评
  title_en: Final Verdict
  summary: 国祚短促而能诛高，然承积弊、无兵可恃，终不免于亡。
  summary_en: His reign was brief yet able to slay Zhao Gao; but he inherited a broken state without troops to lean on, and ruin was not to be escaped.
  place_id: null
