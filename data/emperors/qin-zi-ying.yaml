- year: '-207'
  date_note: 二世三年
  date_note_en: 3rd year of the Second Emperor
  title: 降刘邦
  title_en: Surrender to Liu Bang
  summary: 刘邦入武关至霸上，子婴系颈以组、奉玺降于轵道旁，秦亡。
  summary_en: Liu Bang entered by the Wu Pass and came to Bashang; Ziying, a silk cord about his neck, surrendered with the seals beside the Zhidao road, and Qin was no more.
  place_id: xianyang
  related_person_ids: []
  sources:
