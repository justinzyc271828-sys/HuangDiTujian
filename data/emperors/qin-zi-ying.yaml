  title: 秦王非帝
  title_en: King, Not Emperor
  summary: 子婴去帝号称秦王，不系帝统，图鉴以名分不成立而作准帝。
  summary_en: Ziying bore the title of king, not emperor, and so stands outside the imperial line; the gazetteer treats him as quasi on grounds of title.
  place_id: xianyang
  related_person_ids: []
