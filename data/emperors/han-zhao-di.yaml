  date_note: 元凤四年
  date_note_en: Yuanfeng 4
  title: 傅介子斩楼兰王
  title_en: Fu Jiezi Slays the King of Loulan
  summary: 平乐监傅介子使西域，计斩楼兰王安归，更名其国为鄯善。
  summary_en: Fu Jiezi, superintendent of Pingle, went to the Western Regions, slew the Loulan king Angui by stratagem, and renamed the state Shanshan.
  place_id: loulan
  related_person_ids: []
  sources:
