  date_note_en: Shiyuan 1
  title: 益州廉头姑缯反
  title_en: Revolt in Yizhou
  summary: 益州廉头、姑缯民反，遣吕破胡募吏民及发犍为、蜀郡兵击破之。
  summary_en: The Lientou and Guzeng peoples of Yizhou revolted; Lü Poho was sent to levy men and troops from Qianwei and Shu commanderies and crushed them.
  place_id: yi-zhou
  related_person_ids: []
  sources:
