  date_note: 后元二年二月
  date_note_en: Later 2nd year, 2nd month
  title: 立太子并即位
  title_en: Heir Apparent, then Emperor
  summary: 武帝疾病，立弗陵为太子，霍光受遗诏辅政；明日武帝崩，太子即皇帝位。
  summary_en: With Emperor Wu ill, Fuling was made heir apparent and Huo Guang received the testamentary charge; the next day Wu died and the heir took the throne.
  place_id: chang-an
  related_person_ids:
