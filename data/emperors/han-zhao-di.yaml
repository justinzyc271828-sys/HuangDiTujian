- year: '-81'
  date_note: 始元六年二月
  date_note_en: Shiyuan 6, 2nd month
  title: 盐铁会议
  title_en: The Salt and Iron Debate
  summary: 问郡国贤良文学民所疾苦，议罢盐铁酒榷均输，后罢榷酤。
  summary_en: The worthy and literary men of the commanderies were asked about the people's grievances; the debate over the salt, iron, liquor monopoly, and equal transport led to abolition of the liquor monopoly.
  place_id: chang-an
  related_person_ids: []
  sources:
  - 汉书·卷007·昭帝纪
  - 盐铁论·本议
  card_id: E004
