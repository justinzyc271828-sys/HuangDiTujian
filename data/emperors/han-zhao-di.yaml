  date_note_en: Yuanping 1, 4th month
  title: 昭帝崩
  title_en: Death of Emperor Zhao
  summary: 崩，年二十一，无嗣；大将军霍光等议所立。
  summary_en: He died at twenty-one without issue; General-in-Chief Huo Guang and the others deliberated on a successor.
  place_id: chang-an
