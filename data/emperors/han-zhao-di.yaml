  date_note_en: Yuanfeng 1
  title: 霍光权固
  title_en: Huo Guang's Grip Firm
  summary: 诛反者后霍光专制朝事，昭帝「委任霍光」。
  summary_en: After the purge Huo Guang dominated the court, the emperor entrusting everything to him.
  place_id: chang-an
  related_person_ids: []
  sources:
