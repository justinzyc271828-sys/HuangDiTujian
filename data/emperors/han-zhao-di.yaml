  date_note: 元凤元年
  date_note_en: Yuanfeng 1
  title: 燕王旦上官桀谋反
  title_en: Plot of the King of Yan and Shangguan Jie
  summary: 燕王旦与上官桀、桑弘羊等谋杀霍光废帝，事败族诛，旦自杀。
  summary_en: The king of Yan, Shangguan Jie, Sang Hongyang, and others plotted to kill Huo Guang and depose the emperor; the plot failed, the plotters were executed with their clans, and the king killed himself.
  place_id: chang-an
  related_person_ids: []
