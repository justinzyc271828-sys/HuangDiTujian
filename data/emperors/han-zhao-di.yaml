  title_en: Son of the Hook-Yi Lady
  summary: 武帝少子，母赵婕妤（钩弋夫人）；生年史无系日，此据即位年岁反推。
  summary_en: The youngest son of Emperor Wu, by Lady Zhao, the Hook-Yi Lady; the exact year is unrecorded and back-calculated from his age at accession.
