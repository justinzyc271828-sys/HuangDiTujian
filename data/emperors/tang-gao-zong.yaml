summary: 太宗第九子，长孙皇后所生；永徽年间承贞观遗风；废王立武、立武后，显庆后风眩委政于武后；总章元年平高丽；弘道元年崩，武后临朝。
summary_en: Ninth son of Emperor Taizong by Empress Zhangsun; his Yonghui years carried
  on the Zhenguan legacy; deposing Empress Wang for Wu, he made Wu empress and, from
  the Xianqing years, troubled by vertigo, left the government to her; in the 1st
  year of Zongzhang Goguryeo was subdued. He died in the 1st year of Hongdao; Empress
  Wu took the regency.
