summary: 昭明太子统之孙，侯景废简文后立为帝，改元天正；在位数月，被迫禅位侯景，侯景败后为元帝方面所害，图鉴作准帝。
summary_en: Grandson of the Crown Prince Zhaoming, set up by Hou Jing after the deposition
  of Emperor Jianwen, he changed the era to Tianzheng; after months he was forced
  to abdicate to Jing, and after Jing's fall was done to death by Emperor Yuan's party
  — the gazetteer lists him as quasi-emperor.
