summary: 明帝子，崇儒白虎观，宽厚安民，班超定西域；宠任窦氏，外戚之祸伏焉。
summary_en: Son of Emperor Ming, he exalted Confucianism at White Tiger Hall and ruled with breadth and lenience while Ban Chao settled the Western Regions; his indulgence of the Dou clan planted the consort-clan disaster.
