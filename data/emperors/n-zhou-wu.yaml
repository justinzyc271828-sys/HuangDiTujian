summary: 宇文泰第四子，明帝遗诏继位；建德元年于宫中诛宇文护，亲总万机；建德三年灭佛道二教；建德六年亲征灭北齐，统一北方；宣政元年北伐突厥道病崩。
summary_en: Fourth son of Yuwen Tai, he succeeded by Ming's will; in the 1st year
  of Jiande he slew Yuwen Hu in the palace and took up the government himself; in
  the 3rd year he proscribed Buddhism and Daoism; in the 6th year, campaigning in
  person, he destroyed Northern Qi and united the north; in the 1st year of Xuanzheng,
  on the campaign against the Turks, he fell ill and died.
