summary: 陇西成纪人，好文学；庚子元年于敦煌称凉公，西凉始；迁都酒泉，立泮宫、增高门学生，劝课农桑；嘉兴元年崩，子歆继，后为沮渠蒙逊所灭。
summary_en: A man of Chengji in Longxi, a lover of letters; in the 1st year of Gengzi
  he styled himself Duke of Liang at Dunhuang — the beginning of Western Liang. Moving
  the capital to Jiuquan, he founded an academy, enlarged the students, and encouraged
  farming and mulberries. He died in the 1st year of Jiaxing; his son Xin succeeded,
  and the realm was later destroyed by Juqu Mengxun.
