summary: 宇文泰长子，孝闵被废后继位称天王；武成元年改称皇帝；宽明仁厚、好学能诗，然军国一决于宇文护，武成二年为护所鸩。
summary_en: Eldest son of Yuwen Tai, he succeeded after Xiaomin's deposition, first
  as Heavenly King, then in the 1st year of Wucheng taking the title of emperor; generous
  and learned, a poet, yet the armies and the realm decided by Yuwen Hu, who poisoned
  him in the 2nd year of Wucheng.
