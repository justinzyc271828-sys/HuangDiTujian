summary: 睿宗第三子；唐隆政变诛韦后，先天元年即位，开元元年诛太平公主亲政；开元年间姚崇宋璟为相，史称开元盛世；天宝年间宠杨贵妃、任安禄山，安史之乱起，马嵬赐死贵妃，幸蜀，太上皇归，宝应元年崩。
summary_en: Third son of Ruizong; after the Tanglong coup slew Empress Wei he took
  the throne in the 1st year of Xiantian, and in the 1st year of Kaiyuan destroyed
  the Princess Taiping to rule in person; with Yao Chong and Song Jing as chancellors,
  the Kaiyuan years are called a golden age; in the Tianbao years he doted on Consort
  Yang and trusted An Lushan until the An–Shi rebellion broke, at Mawei he had the
  consort put to death, fled to Shu, and returned as Grand Emperor, dying in the 1st
  year of Baoying.
