summary: 陇西鲜卑乞伏部首领，淝水战后据苑川称大单于，击破邻近鲜卑诸部，受前秦官爵；建义四年崩，弟乾归继，西秦延续。
summary_en: Chief of the Qifu Xianbei of Longxi, after the Fei River defeat he held
  Yuanchuan and styled himself Great Chanyu, broke the neighboring Xianbei tribes,
  and accepted Former Qin's titles; he died in the 4th year of Jianyi, his brother
  Gangui carrying on Western Qin.
