summary: 巴氐流民首领李特之子，继统部众，称成都王、即帝位，国号大成，都成都；在位三十年，赋役较轻、蜀人安之，为十六国中最善治者之一。
summary_en: Son of the Ba-Di refugee leader Li Te, he took over the host, styled himself
  King of Chengdu, then emperor of the realm Dacheng with its capital at Chengdu;
  in thirty years of light levies and easy rule the Shu people were content — one
  of the most benign of the Sixteen States' sovereigns.
