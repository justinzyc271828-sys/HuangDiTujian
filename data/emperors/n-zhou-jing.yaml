summary: 宣帝长子，七岁即位，杨坚为左大丞相；大象二年平尉迟迥等反抗；大定元年禅位于杨坚，周亡隋立，禅后遇害。
summary_en: Eldest son of Xuan, he took the throne at seven with Yang Jian as grand
  chancellor of the left; in the 2nd year of Daxiang the risings of Yuchi Jiong and
  the rest were put down; in the 1st year of Dading he abdicated to Yang Jian — Zhou
  perished, Sui arose, and he was done to death after the abdication.
