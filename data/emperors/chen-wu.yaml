summary: 吴兴寒族起家，讨侯景、破北齐，杀王僧辩专朝政；永定元年受禅称帝，国号陈，三年崩，侄蒨继。
summary_en: Rising from a common house of Wuxing, he destroyed Hou Jing, broke the
  Qi armies, slew Wang Sengbian, and took the government; in the 1st year of Yongding
  he received the abdication and founded Chen. He died in the 3rd year; his nephew
  Qian succeeded.
