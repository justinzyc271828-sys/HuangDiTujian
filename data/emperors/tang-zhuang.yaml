summary: 沙陀李克用长子；天祐五年嗣晋王，与后梁争雄；同光元年称帝于魏州，国号唐，亲征灭后梁，迁都洛阳；同光三年遣郭崇韬灭前蜀；同光四年兴教门之变，中流矢崩。
summary_en: Eldest son of the Shatuo Li Keyong; succeeding as King of Jin in the 5th
  year of Tianyou, he contended with Later Liang; in the 1st year of Tongguang he
  took the throne at Weizhou as the realm Tang, campaigned in person and destroyed
  Later Liang, and moved the capital to Luoyang; in the 3rd year he sent Guo Chongtao
  to destroy Former Shu; in the 4th year came the Xingjiao Gate mutiny, and he fell
  to an arrow.
