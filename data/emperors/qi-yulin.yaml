summary: 武帝太孙，永明十一年即位；游戏无度，宗室萧鸾以辅政之名废之为郁林王而弑，立海陵王。
summary_en: Grandson of Emperor Wu, he took the throne in the 11th year of Yongming;
  playing without limit, he was deposed as Prince of Yulin by the prince Xiao Luan
  — who governed in his name — and slain, Hai ling Wang being set up.
