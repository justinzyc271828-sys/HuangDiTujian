summary: 以铁骑灭胡夏、北燕、北凉而统一北方，又南征临江、晚年灭佛，武功极盛而终被近侍所弑的北魏皇帝。
summary_en: The Northern Wei emperor whose iron cavalry destroyed Hu Xia, Northern Yan, and Northern Liang to unify the north; he campaigned south to the Yangzi and suppressed Buddhism in his late years, and at the height of his military power was murdered by a close attendant.
