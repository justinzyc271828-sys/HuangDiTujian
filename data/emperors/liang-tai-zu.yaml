summary: 宋州砀山人，初为黄巢部将，中和二年降唐，赐名全忠，为宣武节度使；天祐元年逼昭宗迁洛阳而弑之；开平元年受禅称帝，国号梁，都开封；乾化二年为子友珪所弑。
summary_en: A man of Dangshan in Songzhou, at first a general of Huang Chao; he surrendered
  to Tang in the 2nd year of Zhonghe, was renamed Quanzhong, and made military governor
  of Xuanwu; in the 1st year of Tianyou he forced Zhaozong to Luoyang and slew him;
  in the 1st year of Kaiping he received the abdication, founded Liang with its capital
  at Kaifeng; in the 2nd year of Qianhua he was slain by his son Yougui.
