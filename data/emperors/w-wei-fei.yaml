summary: 文帝长子，三年无年号；谋除宇文泰事泄，废为安定公，旋遇害；其在位时西魏破江陵、灭梁元帝。
summary_en: Eldest son of Emperor Wen, he reigned three years without an era name;
  his plot against Yuwen Tai leaked, he was deposed as Duke of Anding and soon done
  to death; in his reign Western Wei broke Jiangling and destroyed Emperor Yuan of
  Liang.
