summary: 前废帝被弑后即位，平晋安王子勋之乱，然泰始中淮北尽失；好读书、善隶书，晚年多忌、骨肉相残；泰豫元年崩。
summary_en: Taking the throne after the Former Deposed Emperor's slaying, he put down
  the Prince of Jin'an's rising, but in the Tai shi years the Huai north was lost;
  a reader of books and a fine calligrapher, in his last years he grew jealous and
  slew his own kin. He died in the 1st year of Taiyu.
