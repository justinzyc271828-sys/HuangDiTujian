summary: 前燕名将，奔秦仕苻坚；淝水败后叛秦，称燕王于荥阳，即帝位于中山，后燕开国；参合陂之败后亲征北魏，病崩于上谷，后燕中衰。
summary_en: The great general of Former Yan, he fled to serve Fu Jian; after the Fei
  River defeat he turned on Qin, styled himself King of Yan at Xingyang, and took
  the throne at Zhongshan — founding Later Yan; after the Canhe marshes disaster he
  campaigned in person against Northern Wei, fell ill, and died at Shanggu, and Later
  Yan declined.
