summary: 哀帝崩后即位，桓温枋头之败后欲立威，诬帝不能男，废为东海王，后降海西公；太元十一年薨于吴。
summary_en: Succeeding Emperor Ai, he was deposed after Huan Wen's defeat at Fangtou
  — Wen, seeking to awe the court, falsely charged the emperor with impotence, degraded
  him to Prince of Donghai and then Duke of Haixi; he died in Wu in the 11th year
  of Taiyuan.
