  title_en: Huang Hao in Power
  summary: 中常侍黄皓专权，政事日坏，姜维避祸屯田沓中。
  summary_en: The eunuch Huang Hao dominated court affairs as they decayed; Jiang Wei, avoiding his malice, went to farm at Tazhong.
