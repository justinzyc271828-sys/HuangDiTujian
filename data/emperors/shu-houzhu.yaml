  title: 邓艾入蜀
  title_en: Deng Ai Enters Shu
  summary: 魏军三路大举，邓艾出阴平越险，克绵竹，兵临成都。
  summary_en: Wei invaded on three roads; Deng Ai came by the Yinping track over impossible ground, took Mianzhu, and reached the gates of Chengdu.
