  title_en: The Northern Expeditions
  summary: 亮上出师表，屯汉中，连年北伐曹魏。
  summary_en: Zhuge Liang memorialized the *Chu Shi Biao*, garrisoned Hanzhong, and year after year campaigned north against Wei.
