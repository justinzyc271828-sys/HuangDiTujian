  title_en: Jiang Wei's Repeated Campaigns
  summary: 费祎死，姜维掌军，连年出陇西，多无大功，国力日耗。
  summary_en: After Fei Yi's death Jiang Wei took the armies and campaigned into Longxi year after year with little gain, draining the state.
