  date_note: 咸熙元年
  date_note_en: 1st year of Xianxi
  title: 封安乐公
  title_en: Duke of Anle
  summary: 举家迁洛阳，魏封安乐公，宴间答「此间乐，不思蜀」。
  summary_en: Brought with his house to Luoyang, he was made Duke of Anle by Wei; at a banquet he answered, "I am happy here, and do not think of Shu."
  place_id: luoyang
