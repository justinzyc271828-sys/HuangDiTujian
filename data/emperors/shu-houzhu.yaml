  date_note: 景耀六年
  date_note_en: 6th year of Jingyao
  title: 刘禅降
  title_en: The Surrender of Liu Shan
  summary: 谯周劝降，禅舆榇出降，蜀汉亡，姜维假降后与钟会同败死。
  summary_en: On Qiao Zhou's counsel Shan surrendered in his cart with the coffin; Shu Han perished, and Jiang Wei, feigning submission, perished with Zhong Hui.
  place_id: cheng-du
