- year: '271'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 任贤则治
  title_en: Rule by Good Counsel
  summary: 史评称任贤相则为循理之君，惑阉竖则为昏暗之后，政在得人。
  summary_en: The histories judge that with worthy ministers he was a right-reasoning sovereign and, beguiled by eunuchs, a darkened one — governance lay in the men he chose.
