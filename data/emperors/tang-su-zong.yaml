summary: 玄宗第三子；安史乱起，马嵬后北上灵武即位，遥尊玄宗为太上皇；至德二载郭子仪等收复两京；乾元中九节度围安庆绪于邺溃败，史思明再起；宝应元年崩。
summary_en: Third son of Xuanzong; when the An–Shi rebellion broke, after Mawei he
  went north and took the throne at Lingwu, honoring Xuanzong as Grand Emperor from
  afar; in the 2nd year of Zhide Guo Ziyi and the others recovered the two capitals;
  in mid-Qianyuan the nine commissioners besieged An Qingxu at Ye and were routed,
  and Shi Siming rose again. He died in the 1st year of Baoying.
