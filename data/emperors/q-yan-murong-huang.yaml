summary: 慕容廆之子，嗣辽东公，自称燕王，筑龙城而都之，破宇文部、拓辽西，前燕王政自此始；永和四年崩，子儁继。
summary_en: Son of Murong Hui, he succeeded as Duke of Liaodong, styled himself King
  of Yan, built Longcheng as his capital, broke the Yuwen tribe, and extended Liaoxi
  — the kingship of Former Yan began here; he died in the 4th year of Yonghe and his
  son Jun succeeded.
