summary: 继位于金陵、对宋称臣求存而终至亡国，以词章成就远超君道事功留名后世的南唐末主。
summary_en: The last ruler of Southern Tang, who succeeded at Jinling, prolonged the state's survival by submitting as a vassal to the Song until its final fall, and is remembered for ci-poetry achievements that far outshine his record as a sovereign.
