summary: 世宗第四子；显德六年世宗崩，宗训即位，年七岁；显德七年陈桥兵变，赵匡胤黄袍加身，恭帝禅位，周亡宋建；降封郑王，后薨。
summary_en: 'Fourth son of Shizong; on Shizong''s death in the 6th year of Xiande,
  Zongxun took the throne at seven; in the 7th year of Xiande came the Chenqiao mutiny
  — Zhao Kuangyin robed in yellow — and the Gong emperor abdicated: Zhou perished
  and Song arose. Reduced to Prince of Zheng, he died later.'
