summary: 孙亮废后迎立，与张布、丁奉设谋诛孙綝，亲政后立学校、置博士；永安六年崩，年三十。
summary_en: Installed after Sun Liang's deposition, he and Zhang Bu and Ding Feng
  laid the plot that slew Sun Chen; governing himself, he founded schools and chairs
  of learning, and died in the 6th year of Yong'an, aged thirty.
