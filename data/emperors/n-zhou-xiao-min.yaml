summary: 宇文泰第三子，泰卒后受西魏恭帝禅位称天王，国号周；初称天王未称皇帝；同年谋宇文护事泄，废为略阳公，旋被弑。
summary_en: Third son of Yuwen Tai, after Tai's death he received the abdication of
  the Gong emperor of Western Wei, taking the title Heavenly King of the realm Zhou;
  he bore the title of king, not yet emperor; that same year his plot against Yuwen
  Hu leaked, he was deposed as Duke of Lüeyang, and soon slain.
