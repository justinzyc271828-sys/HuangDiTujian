  title: 孝武总评
  title_en: Final Verdict
  summary: 初赖谢安，淝水一战保江南；后溺于酒色，委政道子，东晋由盛转衰。
  summary_en: Relying on Xie An at first, the Fei River battle saved the south; later
    he drowned in wine and women, left government to Daozi, and turned Eastern Jin
