summary: 十一岁即位，桓温卒后谢安执政，太元八年淝水之战大破苻坚，乘胜北伐；谢安卒后荒于酒色，太元二十一年醉后为张贵人弑于宫中。
summary_en: Ascending at eleven, he saw Huan Wen die and Xie An govern; in the 8th
  year of Taiyuan the Battle of the Fei River broke Fu Jian utterly, and he pressed
  north on the victory; after Xie An's death he gave himself to wine and women, and
  in the 21st year of Taiyuan, drunk, he was slain in his palace by Lady Zhang.
