summary: 宣武帝第二子，六岁即位，胡太后临朝；正光元年元叉幽太后专政，正光四年六镇起义起；武泰元年帝暴崩，胡太后立幼主，尔朱荣南下——北魏自此而衰。
summary_en: Second son of Xuanwu, he took the throne at six under Empress Hu's regency;
  in the 1st year of Zhengguang Yuan Cha confined the empress and ruled, and in the
  4th year the Six Garrisons rose; in the 1st year of Wutai the emperor died suddenly,
  Empress Hu set up an infant, and Erzhu Rong marched south — the decline of Northern
  Wei began.
