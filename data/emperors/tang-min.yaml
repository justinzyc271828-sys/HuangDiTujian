summary: 明宗第三子；长兴四年即位，改元应顺；幼弱不能制藩镇，应顺元年凤翔李从珂起兵，闵帝出奔，被废为鄂王，旋遇害。
summary_en: Third son of Mingzong; he took the throne in the 4th year of Changxing,
  changing the era to Yingshun; young and weak, unable to control the feudatories,
  when Li Congke rose at Fengxiang in the 1st year of Yingshun the Min emperor fled,
  was deposed as Prince of E, and soon done to death.
