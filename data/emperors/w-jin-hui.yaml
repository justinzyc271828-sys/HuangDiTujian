  title: 即位
  title_en: Accession
  summary: 武帝崩，衷即位，杨骏辅政，贾后干政渐起。
  summary_en: On Emperor Wu's death Zhong took the throne with Yang Jun as regent; Empress Jia's meddling in government began.
