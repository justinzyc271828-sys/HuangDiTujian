summary: 武帝子，性愚钝，在位十六年而八王之乱起，天下大乱；「何不食肉糜」为史所讥，光熙元年还洛后崩，或云被毒杀。
summary_en: Son of Emperor Wu, dull-witted, he sat sixteen years while the War of the Eight Princes tore the realm apart; his "why not eat minced meat?" became a byword for his folly, and in the 1st year of Guangxi he died after returning to Luoyang — by poison, some say.
