  summary: 武帝子，母杨皇后；史称其愚钝，闻蛙鸣而问为官为私。
  summary_en: Son of Emperor Wu by Empress Yang; the histories call him dull — hearing frogs croak, he asked whether they croaked for office or for private gain.
