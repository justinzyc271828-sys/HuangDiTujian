  title: 杀太子遹
  title_en: The Heir Yu Slain
  summary: 贾后诬太子司马遹谋反杀之，赵王伦等起兵讨贾。
  summary_en: Empress Jia charged the heir Sima Yu with revolt and slew him; the Prince of Zhao, Sima Lun, and others rose against her.
