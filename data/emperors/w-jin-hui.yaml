  title: 八王之乱开端
  title_en: The War of the Eight Princes Begins
  summary: 诸王同姓相屠自此始，延十余年，为永嘉之祸张本。
  summary_en: The princes' mutual slaughter began here, running over ten years and preparing the disaster of Yongjia.
  place_id: luoyang
  related_person_ids: []
  sources:
