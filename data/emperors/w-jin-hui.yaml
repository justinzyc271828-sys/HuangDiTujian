  date_note: 名句
  date_note_en: famous saying
  title: 肉糜
  title_en: The Minced Meat
  summary: 天下荒乱百姓饿死，帝曰「何不食肉糜」，史以为愚暗之证。
  summary_en: In the great famine, told that the people were starving to death, he asked, "Why do they not eat minced meat?" — the historians' proof of his darkness.
