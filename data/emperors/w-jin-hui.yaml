  title: 诛杨骏
  title_en: Yang Jun Executed
  summary: 贾后杀杨骏，汝南王亮、卫瓘辅政旋亦死，贾氏专政。
  summary_en: Empress Jia slew Yang Jun; the Princes of Runan, Sima Liang, and Wei Guan, who then governed, died in turn, and the Jia clan ruled.
