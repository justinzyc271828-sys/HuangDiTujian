  date_note: 延康元年十月
  date_note_en: 10th month, 1st year of Yankang
  title: 受禅称帝
  title_en: The Abdication Throne
  summary: 汉献帝禅位，丕即皇帝位于繁阳，改元黄初，国号魏，都洛阳。
  summary_en: Emperor Xian abdicated; Pi took the throne at Fanyang, changed the era to Huangchu, styled the realm Wei, and made Luoyang his capital.
  place_id: luoyang
  related_person_ids:
  - e-han-xian
