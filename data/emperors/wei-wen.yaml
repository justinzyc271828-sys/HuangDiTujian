  date_note_en: 22nd year of Jian'an
  title: 立为魏太子
  title_en: Made Crown Prince of Wei
  summary: 曹操为魏王，立丕为太子，与曹植争储终定。
  summary_en: Cao Cao, king of Wei, made Pi his heir, ending the long rivalry with Cao Zhi.
  place_id: null
