summary: 受禅代汉，建魏都洛阳，定九品官人法之端，性好文学，作《典论》，史称天资文藻。
summary_en: Receiving the abdication of Han, he founded Wei at Luoyang, began the nine-rank method of appointing officials, and, loving letters, wrote the *Dianlun*; the histories call him gifted of literary talent.
