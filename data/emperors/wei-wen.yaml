  date_note: 黄初元年
  date_note_en: 1st year of Huangchu
  title: 定服色郊祀
  title_en: Rites and Vestments Fixed
  summary: 改正朔、易服色，郊祀天地，建立魏朝礼仪框架。
  summary_en: He changed the calendar and vestments, sacrificed to heaven and earth, and framed the ceremonial order of Wei.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
  card_id: E004
- year: '221'
  date_note: 黄初二年
  date_note_en: 2nd year of Huangchu
  title: 杀鲍勋等
  title_en: Execution of Bao Xun and Others
  summary: 执法严急，鲍勋等以谏诤被诛，史有刻深之评。
  summary_en: His enforcement of law was harsh; Bao Xun and others were executed for remonstrance, drawing the historians' charge of severity.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 三国志·卷012·鲍勋传
  card_id: E005
- year: '221'
  date_note: 黄初二年
  date_note_en: 2nd year of Huangchu
  title: 贬爵诸侯
  title_en: Princes Demoted
  summary: 诸王初封旋即贬为县王，抑宗室以强中枢。
  summary_en: The princes, newly enfeoffed, were at once reduced to marquises of counties, restraining the imperial kin to strengthen the center.
  place_id: luoyang
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
  card_id: E006
- year: '222'
  date_note: 黄初三年
  date_note_en: 3rd year of Huangchu
  title: 三路伐吴
  title_en: Three-Pronged Campaign against Wu
  summary: 命曹休、曹仁、曹真等分道击吴，无大功而还。
  summary_en: He sent Cao Xiu, Cao Ren, and Cao Zhen against Wu on separate roads; there was no great gain and the army returned.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
  card_id: E007
- year: '224'
  date_note: 黄初五年
  date_note_en: 5th year of Huangchu
  title: 东巡广陵
  title_en: Eastern Tour to Guangling
  summary: 幸广陵故城，临江观兵，见江涛汹涌而退。
  summary_en: He toured the old city of Guangling and reviewed troops on the river, then withdrew before the surging waters.
  place_id: guangling
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
  card_id: E008
- year: '225'
  date_note: 黄初六年
  date_note_en: 6th year of Huangchu
  title: 再幸广陵
  title_en: Second Tour to Guangling
  summary: 又至广陵临江，终不得渡。
  summary_en: He came again to Guangling's riverbank, yet the crossing was never made.
  place_id: guangling
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
  card_id: E009
- year: '226'
  date_note: 黄初七年五月
  date_note_en: 5th month, 7th year of Huangchu
  title: 文帝崩
  title_en: Death of Emperor Wen
  summary: 崩于洛阳嘉福殿，年四十，明帝叡即位。
  summary_en: He died in the Jiafu Hall at Luoyang, aged forty, and Emperor Ming (Cao Rui) succeeded.
  place_id: luoyang
  related_person_ids:
  - wei-ming
  sources:
  - 三国志·卷002·文帝纪
  card_id: E010
- year: '226'
  date_note: 史评
  date_note_en: verdict of the histories
  title: 文帝总评
  title_en: Final Verdict
  summary: 陈寿评天资文藻、下笔成章，惜乏旷大之度；文学之业传于后世。
  summary_en: Chen Shou praised his literary genius, writing at the brush's touch, while regretting his want of magnanimity; his legacy in letters outlived the realm.
  place_id: null
  related_person_ids: []
  sources:
  - 三国志·卷002·文帝纪
