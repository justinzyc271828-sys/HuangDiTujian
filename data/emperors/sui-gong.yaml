summary: 元德太子昭之子，炀帝之孙；李渊入长安立为帝，改元义宁，遥尊炀帝为太上皇；义宁二年禅位于李渊，隋亡，封鄜国公，寻薨。
summary_en: Son of the Crown Prince Zhao, grandson of Emperor Yang; set up by Li Yuan
  after he entered Chang'an, changing the era to Yining and honoring Emperor Yang
  as Grand Emperor from afar; in the 2nd year of Yining he abdicated to Li Yuan —
  Sui perished — and, made Duke of Fu, died soon after.
