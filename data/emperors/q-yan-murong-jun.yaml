summary: 嗣燕王，乘后赵之乱南进中原，永和八年俘杀冉闵，即皇帝位；迁都邺，前燕全盛；光寿四年崩，子暐幼继，慕容恪辅政。
summary_en: Succeeding as King of Yan, he pressed south into the Central Plains amid
  the chaos of Later Zhao; in the 8th year of Yonghe he captured and slew Ran Min
  and took the imperial throne; moving the capital to Ye, Former Yan reached its height.
  He died in the 4th year of Guangshou, his child heir Wei under Murong Ke's regency.
