summary: 在位十五年以削藩为主线，平西川、破淮西、威服河朔，成就"元和中兴"而暴崩于宦官疑云的中唐皇帝。
summary_en: A mid-Tang emperor whose fifteen-year reign centered on reducing the military provinces, pacifying Xichuan, breaking Huaixi, and overawing Heshuo to achieve the Yuanhe Restoration, before dying suddenly amid suspicions involving eunuchs.
