summary: 匈奴铁弗部，刘卫辰子；叛后秦称天王、大单于，国号大夏；发民夫十万筑统万城，蒸土夯筑，极侈且酷；乘刘裕北还取长安称帝；真兴七年崩，子昌继，后为魏所灭。
summary_en: A Tie Fu Xiongnu, son of Liu Weichen; turning against Later Qin, he styled
  himself Heavenly King and Great Chanyu of the realm Great Xia; driving a hundred
  thousand laborers, he built Tongwan with steamed earth pounded hard — sumptuous
  and cruel beyond measure; riding Liu Yu's return north, he took Chang'an and the
  imperial throne. He died in the 7th year of Zhenxing; his son Chang succeeded, and
  Wei destroyed the realm.
