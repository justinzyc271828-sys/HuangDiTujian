summary: 宪宗第三子；元和十五年宪宗崩（或云为宦官所弑），恒即位，改元长庆；长庆元年河北三镇复叛，元和之功尽失；长庆二年销兵之议，藩镇乘机坐大；游宴怠政，长庆四年崩。
summary_en: Third son of Xianzong; on Xianzong's death in the 15th year of Yuanhe
  — by the eunuchs' hand, some say — Heng took the throne, changing the era to Changqing;
  in the 1st year of Changqing the three garrisons of Hebei rose again, and the gains
  of Yuanhe were lost; in the 2nd year the debate over disbanding the armies let the
  feudatories grow. He played and feasted, neglecting government, and died in the
  4th year of Changqing.
