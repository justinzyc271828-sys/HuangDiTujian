summary: 武帝侄，永定三年即位，破王琳、安集江南，劝农省役，史称天嘉称治；天康元年崩，子伯宗继。
summary_en: Nephew of Emperor Wu, he took the throne in the 3rd year of Yongding,
  broke Wang Lin, and settled the south, urging farming and lightening corvée — the
  "Tianjia recovery" of the histories. He died in the 1st year of Tiankang; his son
  Bozong succeeded.
