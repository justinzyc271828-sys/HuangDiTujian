summary: 孝文帝第二子，孝文崩于南伐后即位；景明元年罢六辅亲政，与梁争淮南义阳，洛阳伽蓝极盛；延昌四年崩，胡太后预政。
summary_en: Second son of Emperor Xiaowen, he took the throne after Xiaowen's death
  on the southern campaign; in the 1st year of Jingming he dismissed the six regents
  and ruled in person, contending with Liang for Huainan and Yiyang while Luoyang's
  monasteries flourished. He died in the 4th year of Yanchang; Empress Hu entered
  the government.
