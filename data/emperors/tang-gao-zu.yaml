summary: 陇西成纪人，唐国公李昞之子；隋末留守太原，大业十三年太原起兵，克长安立恭帝；武德元年受禅称帝，国号唐；玄武门之变后传位太宗，称太上皇。
summary_en: A man of Chengji in Longxi, son of the Duke of Tang, Li Bing; in the last
  years of Sui he held Taiyuan, rose in the 13th year of Daye, took Chang'an, and
  set up Emperor Gong; in the 1st year of Wude he received the abdication and founded
  Tang. After the Xuanwu Gate incident he yielded the throne to Emperor Taizong and
  styled himself Grand Emperor.
