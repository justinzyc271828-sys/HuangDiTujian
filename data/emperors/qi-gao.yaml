summary: 仕宋积军功，平桂阳王休范、沈攸之之乱，废宋自立；受禅称帝，国号齐；性节俭、定礼仪官制，建元四年崩。
summary_en: Rising by arms under Song, he put down the revolts of the Prince of Guiyang
  and Shen Youzhi, and took the Song throne; receiving the abdication, he founded
  Qi. Frugal by nature, he fixed the rites and institutions, and died in the 4th year
  of Jianyuan.
