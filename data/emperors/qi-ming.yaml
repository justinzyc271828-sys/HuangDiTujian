summary: 高帝侄，废郁林、海陵自立；建武年间大诛高武诸子，史称惨毒；孝文帝南伐齐边告急，永泰元年崩。
summary_en: Nephew of Emperor Gao, he deposed the Prince of Yulin and the Prince of
  Hailing to take the throne; in the Jianwu years he slaughtered the sons of Gaodi
  and Wudi — the histories call it poison; Emperor Xiaowen of Wei marched south and
  the border was in peril. He died in the 1st year of Yongtai.
