  summary: 新兴匈奴部人，字元海，冒顿之后。幼好学，习《毛诗》《京氏易》及孙吴兵法。
  summary_en: A Xiongnu of the Xinxing tribe, styled Yuanhai, descendant of Modu;
    studious from youth in the Mao Odes, the Jing-school Changes, and Sun–Wu military
    art.
