summary: 乘八王之乱于离石起兵，称大单于、汉王，以绍汉为号召；永嘉二年称帝迁都平阳，为十六国割据开端之首，史称聪敏好学。
summary_en: Rising at Lishi amid the War of the Eight Princes, he styled himself Great
  Chanyu and King of Han in succession to the Han house; in the 2nd year of Yongjia
  he took the throne and moved his capital to Pingyang, opening the Sixteen States
  era — the histories praise his quickness and love of learning.
