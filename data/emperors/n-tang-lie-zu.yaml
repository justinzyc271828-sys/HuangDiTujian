summary: 徐州人，徐温养子，名知诰；昇元元年受吴禅即帝位，国号齐，旋改唐，都金陵；昇元中复姓李，改名昪，称唐后；息兵保境、劝农桑；昇元七年崩。
summary_en: A man of Xuzhou, adopted son of Xu Wen, named Zhigao; in the 1st year
  of Shengyuan he received the Wu abdication as the realm Qi, soon renamed Tang, with
  its capital at Jinling; in mid-Shengyuan he resumed the surname Li, took the name
  Bian, and claimed descent from the Tang house; he stilled the wars, kept his borders,
  and urged farming. He died in the 7th year of Shengyuan.
