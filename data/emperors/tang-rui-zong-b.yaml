summary: 唐隆政变诛韦后，重茂让位，旦复位；立太子隆基；先天元年传位玄宗，自称太上皇；先天二年太平公主赐死，太上皇完全归政；开元四年崩。
summary_en: After the Tanglong coup slew Empress Wei and Chongmao yielded the throne,
  Dan was restored; he made his heir Longji; in the 1st year of Xiantian he yielded
  the throne to Xuanzong and styled himself Grand Emperor; in the 2nd year the Princess
  Taiping was put to death and the Grand Emperor gave up the government entirely.
  He died in the 4th year of Kaiyuan.
