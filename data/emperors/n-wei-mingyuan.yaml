summary: 道武帝长子，父被弑后平乱即位；乘刘裕灭后秦之机取河南，尽有司兖豫淮北之地；立太子监国制，泰常八年崩。
summary_en: Eldest son of Daowu, he put down the rebellion after his father's slaying
  and took the throne; riding Liu Yu's conquest of Later Qin, he took Henan and held
  Si, Yan, Yu, and the Huai north; he established the heir's regency and died in the
  8th year of Taichang.
