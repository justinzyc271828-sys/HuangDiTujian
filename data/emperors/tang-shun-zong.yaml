summary: 德宗长子；贞元二十一年即位，改元永贞；王叔文、王伾等用事，谋夺宦官兵权，史称永贞革新；疾甚，同年禅位太子纯（宪宗），称太上皇，元和元年崩。
summary_en: Eldest son of Dezong; he took the throne in the 21st year of Zhenyuan,
  changing the era to Yongzhen; Wang Shuwen and Wang Pi held power and sought to take
  the eunuchs' armies — the Yongzhen reform; gravely ill, he abdicated that same year
  to his heir Chun (Xianzong), styled himself Grand Emperor, and died in the 1st year
  of Yuanhe.
