summary: 宣帝长子，大营临春、结绮、望仙诸阁，与张丽华游宴，艳诗《玉树后庭花》成亡国之音；祯明三年隋军入建康，出降，陈亡，南朝终结。
summary_en: Eldest son of Emperor Xuan, he raised the Linchun, Jieqi, and Wangxian
  pavilions and feasted with Zhang Lihua; his *Jade Trees and Rear-Court Flowers*
  became the song of a lost realm. In the 3rd year of Zhenming the Sui armies entered
  Jiankang; he surrendered, Chen perished, and the Southern Dynasties were at an end.
