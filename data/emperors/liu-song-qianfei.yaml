summary: 孝武长子，十六岁即位，一年数改元，诛杀大臣宗室，朝野震恐；景和元年十一月为寿寂之等弑于华林园，在位一年。
summary_en: Eldest son of Emperor Xiaowu, he took the throne at sixteen, changed eras
  several times in a year, and slew ministers and princes until court and realm trembled;
  in the eleventh month of the 1st year of Jinghe he was slain by Shou Jizhi and the
  others in the Hualin Park — one year on the throne.
