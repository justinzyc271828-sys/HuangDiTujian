summary: 陕州硖石人；开平元年梁以季兴为荆南节度使；同光二年唐封南平王；据江陵弹丸之地，诸国商贾过境抽税，史称高赖子；天成三年卒。
summary_en: A man of Xiashi in Shanzhou; in the 1st year of Kaiping Liang made Jixing
  military governor of Jingnan; in the 2nd year of Tongguang Tang made him King of
  Nanping; holding the sliver of Jiangling, he taxed the merchants of every state
  passing through — the histories call him the "Gao rascal." He died in the 3rd year
  of Tiancheng.
