summary: 沙陀部，仕晋为河东将；契丹入汴灭晋后，知远于太原称帝，国号汉；契丹北还，知远入汴，改元乾祐，杀杜重威等；乾祐元年崩。
summary_en: A Shatuo, a Hedong general under Jin; after the Khitan took Kaifeng and
  destroyed Jin, Zhiyuan took the throne at Taiyuan as the realm Han; when the Khitan
  withdrew north he entered Kaifeng, changed the era to Qianyou, and slew Du Zhongwei
  and the rest. He died in the 1st year of Qianyou.
