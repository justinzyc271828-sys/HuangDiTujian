summary: 河西鲜卑秃发部首领，叛后凉称西平王，筑廉川堡为都，拓地广武，改称武威王，南凉始；太初三年酒醉坠马伤肋而崩，弟利鹿孤继。
summary_en: Chief of the Tufa Xianbei of Hexi, he turned against Later Liang, styled
  himself King of Xiping, built Lianchuan as his capital, extended his lands to Guangwu,
  and took the title King of Wuwei — the beginning of Southern Liang. In the 3rd year
  of Taichu, drunk, he fell from his horse and died of the hurt; his brother Lilugu
  succeeded.
