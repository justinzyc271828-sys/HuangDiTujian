summary: 昪长子；保大元年即位；保大中出兵灭闽（部分）；好文学，与冯延巳等，词风婉约；交泰元年周世宗南伐，璟去帝号称国主，割江北；建隆二年迁都洪州，崩。
summary_en: Eldest son of Bian; he took the throne in the 1st year of Baoda and in
  mid-Baoda sent armies to destroy part of Min; a lover of letters, with Feng Yansi
  and the rest, his ci verse elegant and soft; in the 1st year of Jiaotai Emperor
  Shizong of Zhou campaigned south, Jing dropped the imperial title for "ruler," ceding
  the lands north of the Yangzi; in the 2nd year of Jianlong he moved the capital
  to Hongzhou and died.
