summary: 少帝废后自江陵入继，诛徐羡之等亲政；元嘉三十年治世，劝农兴学、户口蕃息，史称「元嘉之治」；然元嘉北伐两败，晚年立嗣不明，为太子劭所弑。
summary_en: Entering from Jiangling after the Young Emperor's deposition, he slew
  Xu Xianzhi and the others to rule in person; his thirty years of the Yuanjia era
  — encouraging farming and learning, households multiplying — are the celebrated
  "Yuanjia recovery"; but the Yuanjia expeditions failed twice, and in his last years,
  his succession unsecured, he was slain by his own heir Shao.
