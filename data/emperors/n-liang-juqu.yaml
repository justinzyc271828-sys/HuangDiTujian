summary: 临松卢水胡，博涉群史；推段业为凉州牧，旋杀业自立，称凉州牧、张掖公，北凉实始；迁都姑臧称河西王，玄始十年破敦煌灭西凉，一统河西大部；义和三年崩。
summary_en: A Lushui Hu of Linsong, learned in the histories; he pushed Duan Ye to
  the governorship of Liangzhou, then slew Ye and stood himself, styling himself Governor
  of Liangzhou and Duke of Zhangye — the real beginning of Northern Liang. Moving
  the capital to Guzang, he took the title King of Hexi; in the 10th year of Xuanshi
  he broke Dunhuang, destroyed Western Liang, and united most of Hexi. He died in
  the 3rd year of Yihe.
