summary: 沙陀部，明宗之婿，河东节度使；清泰三年称帝于太原，联契丹灭后唐，认契丹主为父，割幽蓟等十六州——史称儿皇帝；天福三年契丹改国号为辽，称臣岁贡格局固定；天福七年崩。
summary_en: A Shatuo, son-in-law of Mingzong and governor of Hedong; in the 3rd year
  of Qingtai he took the throne at Taiyuan, destroyed Later Tang with the Khitan,
  acknowledged the Khitan ruler as father, and ceded the sixteen prefectures of Youji
  — the "son emperor" of the histories; in the 3rd year of Tianfu the Khitan took
  the name Liao, and the tribute-and-vassal order was fixed. He died in the 7th year
  of Tianfu.
