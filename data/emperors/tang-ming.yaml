summary: 代北沙陀，李克用养子，本名邈佶烈；庄宗崩于乱中，嗣源入洛即位；宽政息兵，留心民事，史称五代少有的小康之主；长兴四年崩。
summary_en: A Shatuo of Daibei, adopted son of Li Keyong, originally named Miaojiilie;
  with Zhuangzong dead in the chaos, Siyuan entered Luoyang and took the throne; lenient
  in government and stilling the wars, attentive to the people — the histories call
  him the one modest peace of the Five Dynasties. He died in the 4th year of Changxing.
