summary: 肃宗长子；宝应元年即位，史朝义平，安史之乱大致结束；广德元年吐蕃入长安，帝幸陕；永泰元年仆固怀恩引回纥吐蕃入寇，郭子仪单骑盟回纥；大历十四年崩。
summary_en: Eldest son of Suzong; on the throne in the 1st year of Baoying, he saw
  Shi Chaoyi destroyed and the An–Shi rebellion roughly ended; in the 1st year of
  Guangde the Tibetans entered Chang'an and the emperor fled to Shan; in the 1st year
  of Yongtai Pugu Huaien drew in the Uyghurs and Tibetans, and Guo Ziyi rode alone
  to make peace with the Uyghurs. He died in the 14th year of Dali.
